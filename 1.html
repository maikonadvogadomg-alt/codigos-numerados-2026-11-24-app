k) { :root:not([data-theme=\&quot;light\&quot;]) {\n  --bg: #0f1522; --papel: #172033; --tinta: #e7ecf6; --mudo: #9aa6bb; --linha: #2a3650; --azul: #7aa2ff; --verde: #4fd3a0; --codigo-bg: #0a1020; --codigo-tx: #dbe6ff; --aviso: #2b2614; --aviso-borda: #7d6a2c; color-scheme: dark } }\n:root[data-theme=\&quot;dark\&quot;] { --bg: #0f1522; --papel: #172033; --tinta: #e7ecf6; --mudo: #9aa6bb; --linha: #2a3650; --azul: #7aa2ff; --verde: #4fd3a0; --codigo-bg: #0a1020; --codigo-tx: #dbe6ff; --aviso: #2b2614; --aviso-borda: #7d6a2c; color-scheme: dark }\n* { box-sizing: border-box; }\nbody { background: var(--bg); color: var(--tinta); font: 16px/1.55 var(--texto); padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overscroll-behavior: none; }\nmain { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }\nh1 { font: 700 30px/1.15 var(--titulo); margin: 0; text-wrap: balance; }\nh2 { font: 700 21px/1.25 var(--titulo); margin: 0; text-wrap: balance; }\np { margin: 0; }\n.sub { color: var(--mudo); }\n.bloco { background: var(--papel); border: 1px solid var(--linha); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }\n.passo { font: 600 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--azul); }\n.aviso { background: var(--aviso); border: 1px solid var(--aviso-borda); border-radius: 12px; padding: 12px 14px; }\n.topo-codigo { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }\n.topo-codigo span { color: var(--mudo); font-size: 14px; flex: 1; min-width: 0; }\nbutton.copiar { font: 600 16px var(--texto); background: var(--azul); color: #fff; border: 0; border-radius: 10px; padding: 10px 16px; min-height: 44px; cursor: pointer; }\nbutton.copiar.ok { background: var(--verde); }\nbutton.copiar:focus-visible { outline: 3px solid var(--tinta); outline-offset: 2px; }\npre { margin: 0; background: var(--codigo-bg); color: var(--codigo-tx); border-radius: 10px; padding: 12px; overflow-x: auto; font: 13px/1.5 var(--mono); max-height: 340px; }\nul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }\ntable { border-collapse: collapse; width: 100%; font-size: 15px; }\n.tabela { overflow-x: auto; }\ntd, th { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--linha); vertical-align: top; }\nth { font-weight: 600; color: var(--mudo); font-size: 13px; }\ncode { font-family: var(--mono); font-size: .92em; }\n.gaveta { font-family: var(--mono); color: var(--azul); white-space: nowrap; }\n\u003c/style&gt;\n\n\u003cmain&gt;\n  \u003cheader style=\&quot;display:flex;flex-direction:column;gap:6px\&quot;&gt;\n    \u003ch1&gt;Esquema do Banco\u003c/h1&gt;\n    \u003cp class=\&quot;sub\&quot;&gt;Meu Chat + SK Jurídico · Supabase do Maikon · versão 23/11-B\u003c/p&gt;\n  \u003c/header&gt;\n\n  \u003csection class=\&quot;aviso\&quot;&gt;\n    \u003cp&gt;\u003cb&gt;Pode rodar quantas vezes quiser: nada é apagado.\u003c/b&gt; Todos os comandos daqui usam \u003ccode&gt;if not exists\u003c/code&gt; (só cria o que ainda não existe) ou \u003ccode&gt;create or replace view\u003c/code&gt; (só troca a \&quot;janela\&quot;, não os dados). As suas conversas, códigos e documentos continuam onde estão.\u003c/p&gt;\n  \u003c/section&gt;\n\n  \u003csection class=\&quot;bloco\&quot;&gt;\n    \u003ch2&gt;Como o banco é organizado\u003c/h2&gt;\n    \u003cp&gt;É um \u003cb&gt;arquivo de aço com gavetas\u003c/b&gt;. A tabela de verdade é uma só, a \u003ccode&gt;mc_itens\u003c/code&gt;. A coluna \u003cb&gt;tipo\u003c/b&gt; diz em qual gaveta cada coisa está. Coisa nova não precisa de tabela nova: é só uma gaveta nova.\u003c/p&gt;\n    \u003cdiv class=\&quot;tabela\&quot;&gt;\u003ctable&gt;\n      \u003ctr&gt;\u003cth&gt;Gaveta (tipo)\u003c/th&gt;\u003cth&gt;O que guarda\u003c/th&gt;\u003c/tr&gt;\n      \u003ctr&gt;\u003ctd class=\&quot;gaveta\&quot;&gt;conversa\u003c/td&gt;\u003ctd&gt;💬 cada conversa do Meu Chat\u003c/td&gt;\u003c/tr&gt;\n      \u003ctr&gt;\u003ctd class=\&quot;gaveta\&quot;&gt;codigo\u003c/td&gt;\u003ctd&gt;🧪 os códigos do playground\u003c/td&gt;\u003c/tr&gt;\n      \u003ctr&gt;\u003ctd class=\&quot;gaveta\&quot;&gt;memoria · prefs · links\u003c/td&gt;\u003ctd&gt;🧠 memória, ⚙️ configurações, 🔗 links\u003c/td&gt;\u003c/tr&gt;\n      \u003ctr&gt;\u003ctd class=\&quot;gaveta\&quot;&gt;cofre\u003c/td&gt;\u003ctd&gt;🔐 chaves e senhas, \u003cb&gt;trancadas\u003c/b&gt; com a senha do login\u003c/td&gt;\u003c/tr&gt;\n      \u003ctr&gt;\u003ctd class=\&quot;gaveta\&quot;&gt;jur:documentos · jur:modelos\u003c/td&gt;\u003ctd&gt;⚖️ peças e modelos do jurídico\u003c/td&gt;\u003c/tr&gt;\n      \u003ctr&gt;\u003ctd class=\&quot;gaveta\&quot;&gt;jur:ementas\u003c/td&gt;\u003ctd&gt;📚 ementas e jurisprudência que você guardou\u003c/td&gt;\u003c/tr&gt;\n      \u003ctr&gt;\u003ctd class=\&quot;gaveta\&quot;&gt;jur:historico · jur:conversas\u003c/td&gt;\u003ctd&gt;🕘 histórico e conversas do jurídico\u003c/td&gt;\u003c/tr&gt;\n      \u003ctr&gt;\u003ctd class=\&quot;gaveta\&quot;&gt;jur:regras · jur:codigos\u003c/td&gt;\u003ctd&gt;📏 regras (e o pacote) e códigos do jurídico\u003c/td&gt;\u003c/tr&gt;\n      \u003ctr&gt;\u003ctd class=\&quot;gaveta\&quot;&gt;jur:prefs\u003c/td&gt;\u003ctd&gt;👤 seus dados, 📄 modelos do Word, 🤖 clientes do robô\u003c/td&gt;\u003c/tr&gt;\n    \u003c/table&gt;\u003c/div&gt;\n    \u003cp class=\&quot;sub\&quot;&gt;\u003cb&gt;E-mail e senha\u003c/b&gt; ficam numa tabela própria do Supabase, a \u003ccode&gt;auth.users\u003c/code&gt; (em \u003cb&gt;Authentication → Users\u003c/b&gt;). A senha fica embaralhada: ninguém consegue ler, nem você, nem o Supabase. Isso é igual em qualquer sistema sério, inclusive na Replit.\u003c/p&gt;\n  \u003c/section&gt;\n\n  \u003csection class=\&quot;bloco\&quot;&gt;\n    \u003cdiv class=\&quot;passo\&quot;&gt;Passo 1 · obrigatório, uma vez\u003c/div&gt;\n    \u003ch2&gt;A tabela principal + o \&quot;ao vivo\&quot;\u003c/h2&gt;\n    \u003cp&gt;Cria a \u003ccode&gt;mc_itens\u003c/code&gt;, a trava \&quot;cada um vê só o seu\&quot; e liga o ao vivo (o que você escreve num aparelho aparece no outro).\u003c/p&gt;\n    \u003cdiv class=\&quot;topo-codigo\&quot;&gt;\u003cspan&gt;Supabase → SQL Editor → New query → cole → Run\u003c/span&gt;\u003cbutton class=\&quot;copiar\&quot; data-alvo=\&quot;sql1\&quot;&gt;📋 Copiar\u003c/button&gt;\u003c/div&gt;\n\u003cpre id=\&quot;sql1\&quot;&gt;create table if not exists public.mc_itens (\n  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,\n  tipo text not null,\n  id text not null,\n  dados jsonb,\n  apagado boolean not null default false,\n  atualizado bigint not null,\n  primary key (user_id, tipo, id)\n);\ncreate index if not exists mc_itens_atualizado on public.mc_itens (user_id, atualizado);\nalter table public.mc_itens enable row level security;\ndrop policy if exists \&quot;cada um ve o seu\&quot; on public.mc_itens;\ncreate policy \&quot;cada um ve o seu\&quot; on public.mc_itens for all\n  using (auth.uid() = user_id) with check (auth.uid() = user_id);\ndo $$ begin alter publication supabase_realtime add table public.mc_itens; exception when others then null; end $$;\u003c/pre&gt;\n    \u003cp class=\&quot;sub\&quot;&gt;A linha \u003ccode&gt;drop policy\u003c/code&gt; apaga só a \u003cb&gt;regra de acesso antiga\u003c/b&gt; para pôr a nova no lugar. Nenhum dado sai.\u003c/p&gt;\n  \u003c/section&gt;\n\n  \u003csection class=\&quot;bloco\&quot;&gt;\n    \u003cdiv class=\&quot;passo\&quot;&gt;Passo 2 · opcional\u003c/div&gt;\n    \u003ch2&gt;Janelas do Meu Chat (para ver como tabelas, igual na Replit)\u003c/h2&gt;\n    \u003cp&gt;Cria \&quot;janelas\&quot; que mostram cada gaveta como uma tabela separada no \u003cb&gt;Table Editor\u003c/b&gt;: \u003ccode&gt;mc_conversas\u003c/code&gt;, \u003ccode&gt;mc_codigos\u003c/code&gt;, \u003ccode&gt;mc_memoria\u003c/code&gt;, \u003ccode&gt;mc_links\u003c/code&gt; e \u003ccode&gt;mc_cofre\u003c/code&gt;. Elas só \u003cb&gt;mostram\u003c/b&gt;: o app continua gravando na \u003ccode&gt;mc_itens\u003c/code&gt;.\u003c/p&gt;\n    \u003cdiv class=\&quot;topo-codigo\&quot;&gt;\u003cspan&gt;Rode depois do passo 1\u003c/span&gt;\u003cbutton class=\&quot;copiar\&quot; data-alvo=\&quot;sql2\&quot;&gt;📋 Copiar\u003c/button&gt;\u003c/div&gt;\n\u003cpre id=\&quot;sql2\&quot;&gt;create or replace view public.mc_conversas with (security_invoker = on) as\n  select id, dados-&gt;&gt;'titulo' as titulo, dados-&gt;&gt;'nMsgs' as mensagens,\n         to_timestamp(atualizado / 1000.0) as atualizado\n  from public.mc_itens where tipo = 'conversa' and not apagado;\n\ncreate or replace view public.mc_codigos with (security_invoker = on) as\n  select id, dados-&gt;&gt;'nome' as nome, dados-&gt;&gt;'lang' as linguagem, dados-&gt;&gt;'codigo' as codigo,\n         to_timestamp(atualizado / 1000.0) as atualizado\n  from public.mc_itens where tipo = 'codigo' and not apagado;\n\ncreate or replace view public.mc_memoria with (security_invoker = on) as\n  select dados-&gt;&gt;'texto' as memoria, to_timestamp(atualizado / 1000.0) as atualizado\n  from public.mc_itens where tipo = 'memoria' and not apagado;\n\ncreate or replace view public.mc_links with (security_invoker = on) as\n  select l-&gt;&gt;'nome' as nome, l-&gt;&gt;'url' as endereco\n  from public.mc_itens, jsonb_array_elements(coalesce(dados-&gt;'lista', '[]'::jsonb)) as l\n  where tipo = 'links' and not apagado;\n\ncreate or replace view public.mc_cofre with (security_invoker = on) as\n  select id, 'trancado com a senha do login' as conteudo, to_timestamp(atualizado / 1000.0) as atualizado\n  from public.mc_itens where tipo = 'cofre' and not apagado;\u003c/pre&gt;\n  \u003c/section&gt;\n\n  \u003csection class=\&quot;bloco\&quot;&gt;\n    \u003cdiv class=\&quot;passo\&quot;&gt;Passo 3 · opcional · só se o jurídico usa o MESMO banco do Meu Chat\u003c/div&gt;\n    \u003ch2&gt;Janelas do SK Jurídico (banco junto com o Meu Chat)\u003c/h2&gt;\n    \u003cp class=\&quot;sub\&quot;&gt;Se você criou um \u003cb&gt;Supabase separado só para o jurídico\u003c/b&gt;, pule este passo e use o bloco \&quot;Jurídico com banco próprio\&quot;, mais abaixo.\u003c/p&gt;\n    \u003cp&gt;Uma tabela para cada parte do jurídico: \u003ccode&gt;jur_documentos\u003c/code&gt;, \u003ccode&gt;jur_modelos\u003c/code&gt;, \u003ccode&gt;jur_ementas\u003c/code&gt; (a jurisprudência), \u003ccode&gt;jur_historico\u003c/code&gt;, \u003ccode&gt;jur_conversas\u003c/code&gt;, \u003ccode&gt;jur_regras\u003c/code&gt;, \u003ccode&gt;jur_codigos\u003c/code&gt;, \u003ccode&gt;jur_robo_clientes\u003c/code&gt; (os clientes do 🤖 robô de prazos) e \u003ccode&gt;jur_modelos_word\u003c/code&gt; (os seus Word com cabeçalho e rodapé).\u003c/p&gt;\n    \u003cdiv class=\&quot;topo-codigo\&quot;&gt;\u003cspan&gt;Rode depois do passo 1\u003c/span&gt;\u003cbutton class=\&quot;copiar\&quot; data-alvo=\&quot;sql3\&quot;&gt;📋 Copiar\u003c/button&gt;\u003c/div&gt;\n\u003cpre id=\&quot;sql3\&quot;&gt;create or replace view public.jur_documentos with (security_invoker = on) as\n  select id, dados-&gt;&gt;'titulo' as titulo, dados-&gt;&gt;'html' as texto, to_timestamp(atualizado / 1000.0) as atualizado\n  from public.mc_itens where tipo = 'jur:documentos' and not apagado;\n\ncreate or replace view public.jur_modelos with (security_invoker = on) as\n  select id, dados-&gt;&gt;'titulo' as titulo, dados-&gt;&gt;'categoria' as categoria, dados-&gt;&gt;'html' as texto, to_timestamp(atualizado / 1000.0) as atualizado\n  from public.mc_itens where tipo = 'jur:modelos' and not apagado;\n\ncreate or replace view public.jur_ementas with (security_invoker = on) as\n  select id, dados-&gt;&gt;'titulo' as titulo, dados-&gt;&gt;'categoria' as categoria, coalesce(dados-&gt;&gt;'texto', dados-&gt;&gt;'md') as texto, to_timestamp(atualizado / 1000.0) as atualizado\n  from public.mc_itens where tipo = 'jur:ementas' and not apagado;\n\ncreate or replace view public.jur_historico with (security_invoker = on) as\n  select id, dados-&gt;&gt;'titulo' as titulo, to_timestamp(atualizado / 1000.0) as atualizado, dados\n  from public.mc_itens where tipo = 'jur:historico' and not apagado;\n\ncreate or replace view public.jur_conversas with (security_invoker = on) as\n  select id, dados-&gt;&gt;'titulo' as titulo, to_timestamp(atualizado / 1000.0) as atualizado, dados\n  from public.mc_itens where tipo = 'jur:conversas' and not apagado;\n\ncreate or replace view public.jur_regras with (security_invoker = on) as\n  select id, dados-&gt;&gt;'tipo' as tipo, dados-&gt;&gt;'titulo' as titulo, dados-&gt;&gt;'ativa' as ligada, dados-&gt;&gt;'texto' as texto\n  from public.mc_itens where tipo = 'jur:regras' and not apagado;\n\ncreate or replace view public.jur_codigos with (security_invoker = on) as\n  select id, coalesce(dados-&gt;&gt;'titulo', dados-&gt;&gt;'nome') as nome, dados-&gt;&gt;'codigo' as codigo, to_timestamp(atualizado / 1000.0) as atualizado\n  from public.mc_itens where tipo = 'jur:codigos' and not apagado;\n\ncreate or replace view public.jur_robo_clientes with (security_invoker = on) as\n  select c-&gt;&gt;'processo' as processo, c-&gt;&gt;'nome_completo' as nome, c-&gt;&gt;'email' as email,\n         c-&gt;&gt;'telefone' as telefone, c-&gt;&gt;'tratamento' as tratamento, c-&gt;&gt;'nome_caso' as caso\n  from public.mc_itens,\n       jsonb_array_elements(case when jsonb_typeof(dados-&gt;'djen:clientes') = 'array' then dados-&gt;'djen:clientes' else '[]'::jsonb end) as c\n  where tipo = 'jur:prefs' and not apagado;\n\ncreate or replace view public.jur_modelos_word with (security_invoker = on) as\n  select m-&gt;&gt;'nome' as nome, to_timestamp((m-&gt;&gt;'criado')::bigint / 1000.0) as importado\n  from public.mc_itens,\n       jsonb_array_elements(case when jsonb_typeof(dados-&gt;'timbrados') = 'array' then dados-&gt;'timbrados' else '[]'::jsonb end) as m\n  where tipo = 'jur:prefs' and not apagado;\u003c/pre&gt;\n  \u003c/section&gt;\n\n  \u003csection class=\&quot;bloco\&quot;&gt;\n    \u003cdiv class=\&quot;passo\&quot;&gt;Jurídico com banco próprio · no Supabase SÓ do jurídico\u003c/div&gt;\n    \u003ch2&gt;Uma tabela para cada parte do jurídico\u003c/h2&gt;\n    \u003cp&gt;Para o Supabase \u003cb&gt;separado\u003c/b&gt; do jurídico. Cria 11 tabelas de verdade, cada uma com a sua função: \u003ccode&gt;jur_config\u003c/code&gt; (seus dados, modelos do Word, robô), \u003ccode&gt;jur_chaves\u003c/code&gt; (chaves de IA \u003cb&gt;trancadas\u003c/b&gt; com a sua senha), \u003ccode&gt;jur_documentos\u003c/code&gt;, \u003ccode&gt;jur_modelos\u003c/code&gt;, \u003ccode&gt;jur_ementas\u003c/code&gt; (jurisprudência), \u003ccode&gt;jur_historico\u003c/code&gt;, \u003ccode&gt;jur_conversas\u003c/code&gt;, \u003ccode&gt;jur_regras\u003c/code&gt;, \u003ccode&gt;jur_codigos\u003c/code&gt;, \u003ccode&gt;jur_clientes\u003c/code&gt; (cadastro de clientes) e \u003ccode&gt;jur_publicacoes\u003c/code&gt; (o que o robô achar). Todas têm as colunas: \u003ccode&gt;id\u003c/code&gt;, \u003ccode&gt;titulo\u003c/code&gt;, \u003ccode&gt;dados\u003c/code&gt;, \u003ccode&gt;apagado\u003c/code&gt;, \u003ccode&gt;atualizado\u003c/code&gt;.\u003c/p&gt;\n    \u003cdiv class=\&quot;topo-codigo\&quot;&gt;\u003cspan&gt;No Supabase do jurídico → SQL Editor → New query → cole → Run\u003c/span&gt;\u003cbutton class=\&quot;copiar\&quot; data-alvo=\&quot;sql7\&quot;&gt;📋 Copiar\u003c/button&gt;\u003c/div&gt;\n\u003cpre id=\&quot;sql7\&quot;&gt;-- ⚖️ SK Jurídico — banco PRÓPRIO (uma tabela para cada parte). Rode no Supabase do jurídico: SQL Editor → New query → cole → Run.\n-- Pode rodar de novo quando quiser: só cria o que ainda não existe. Não apaga nada.\n\n-- jur_config: seus dados, modelos do Word, robô (vistos/lidas)\ncreate table if not exists public.jur_config (\n  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,\n  id text not null,\n  titulo text,\n  dados jsonb,\n  apagado boolean not null default false,\n  atualizado bigint not null,\n  primary key (user_id, id)\n);\ncreate index if not exists jur_config_atualizado on public.jur_config (user_id, atualizado);\nalter table public.jur_config enable row level security;\ndrop policy if exists &amp;quot;cada um ve o seu&amp;quot; on public.jur_config;\ncreate policy &amp;quot;cada um ve o seu&amp;quot; on public.jur_config for all using (auth.uid() = user_id) with check (auth.uid() = user_id);\ndo $$ begin alter publication supabase_realtime add table public.jur_config; exception when others then null; end $$;\n\n-- jur_chaves: chaves de IA TRANCADAS com a sua senha do login\ncreate table if not exists public.jur_chaves (\n  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,\n  id text not null,\n  titulo text,\n  dados jsonb,\n  apagado boolean not null default false,\n  atualizado bigint not null,\n  primary key (user_id, id)\n);\ncreate index if not exists jur_chaves_atualizado on public.jur_chaves (user_id, atualizado);\nalter table public.jur_chaves enable row level security;\ndrop policy if exists &amp;quot;cada um ve o seu&amp;quot; on public.jur_chaves;\ncreate policy &amp;quot;cada um ve o seu&amp;quot; on public.jur_chaves for all using (auth.uid() = user_id) with check (auth.uid() = user_id);\ndo $$ begin alter publication supabase_realtime add table public.jur_chaves; exception when others then null; end $$;\n\n-- jur_documentos: peças\ncreate table if not exists public.jur_documentos (\n  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,\n  id text not null,\n  titulo text,\n  dados jsonb,\n  apagado boolean not null default false,\n  atualizado bigint not null,\n  primary key (user_id, id)\n);\ncreate index if not exists jur_documentos_atualizado on public.jur_documentos (user_id, atualizado);\nalter table public.jur_documentos enable row level security;\ndrop policy if exists &amp;quot;cada um ve o seu&amp;quot; on public.jur_documentos;\ncreate policy &amp;quot;cada um ve o seu&amp;quot; on public.jur_documentos for all using (auth.uid() = user_id) with check (auth.uid() = user_id);\ndo $$ begin alter publication supabase_realtime add table public.jur_documentos; exception when others then null; end $$;\n\n-- jur_modelos: modelos de peça\ncreate table if not exists public.jur_modelos (\n  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,\n  id text not null,\n  titulo text,\n  dados jsonb,\n  apagado boolean not null default false,\n  atualizado bigint not null,\n  primary key (user_id, id)\n);\ncreate index if not exists jur_modelos_atualizado on public.jur_modelos (user_id, atualizado);\nalter table public.jur_modelos enable row level security;\ndrop policy if exists &amp;quot;cada um ve o seu&amp;quot; on public.jur_modelos;\ncreate policy &amp;quot;cada um ve o seu&amp;quot; on public.jur_modelos for all using (auth.uid() = user_id) with check (auth.uid() = user_id);\ndo $$ begin alter publication supabase_realtime add table public.jur_modelos; exception when others then null; end $$;\n\n-- jur_ementas: ementas e jurisprudência\ncreate table if not exists public.jur_ementas (\n  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,\n  id text not null,\n  titulo text,\n  dados jsonb,\n  apagado boolean not null default false,\n  atualizado bigint not null,\n  primary key (user_id, id)\n);\ncreate index if not exists jur_ementas_atualizado on public.jur_ementas (user_id, atualizado);\nalter table public.jur_ementas enable row level security;\ndrop policy if exists &amp;quot;cada um ve o seu&amp;quot; on public.jur_ementas;\ncreate policy &amp;quot;cada um ve o seu&amp;quot; on public.jur_ementas for all using (auth.uid() = user_id) with check (auth.uid() = user_id);\ndo $$ begin alter publication supabase_realtime add table public.jur_ementas; exception when others then null; end $$;\n\n-- jur_historico: histórico\ncreate table if not exists public.jur_historico (\n  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,\n  id text not null,\n  titulo text,\n  dados jsonb,\n  apagado boolean not null default false,\n  atualizado bigint not null,\n  primary key (user_id, id)\n);\ncreate index if not exists jur_historico_atualizado on public.jur_historico (user_id, atualizado);\nalter table public.jur_historico enable row level security;\ndrop policy if exists &amp;quot;cada um ve o seu&amp;quot; on public.jur_historico;\ncreate policy &amp;quot;cada um ve o seu&amp;quot; on public.jur_historico for all using (auth.uid() = user_id) with check (auth.uid() = user_id);\ndo $$ begin alter publication supabase_realtime add table public.jur_historico; exception when others then null; end $$;\n\n-- jur_conversas: conversas com a IA\ncreate table if not exists public.jur_conversas (\n  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,\n  id text not null,\n  titulo text,\n  dados jsonb,\n  apagado boolean not null default false,\n  atualizado bigint not null,\n  primary key (user_id, id)\n);\ncreate index if not exists jur_conversas_atualizado on public.jur_conversas (user_id, atualizado);\nalter table public.jur_conversas enable row level security;\ndrop policy if exists &amp;quot;cada um ve o seu&amp;quot; on public.jur_conversas;\ncreate policy &amp;quot;cada um ve o seu&amp;quot; on public.jur_conversas for all using (auth.uid() = user_id) with check (auth.uid() = user_id);\ndo $$ begin alter publication supabase_realtime add table public.jur_conversas; exception when others then null; end $$;\n\n-- jur_regras: regras (e o pacote)\ncreate table if not exists public.jur_regras (\n  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,\n  id text not null,\n  titulo text,\n  dados jsonb,\n  apagado boolean not null default false,\n  atualizado bigint not null,\n  primary key (user_id, id)\n);\ncreate index if not exists jur_regras_atualizado on public.jur_regras (user_id, atualizado);\nalter table public.jur_regras enable row level security;\ndrop policy if exists &amp;quot;cada um ve o seu&amp;quot; on public.jur_regras;\ncreate policy &amp;quot;cada um ve o seu&amp;quot; on public.jur_regras for all using (auth.uid() = user_id) with check (auth.uid() = user_id);\ndo $$ begin alter publication supabase_realtime add table public.jur_regras; exception when others then null; end $$;\n\n-- jur_codigos: códigos\ncreate table if not exists public.jur_codigos (\n  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,\n  id text not null,\n  titulo text,\n  dados jsonb,\n  apagado boolean not null default false,\n  atualizado bigint not null,\n  primary key (user_id, id)\n);\ncreate index if not exists jur_codigos_atualizado on public.jur_codigos (user_id, atualizado);\nalter table public.jur_codigos enable row level security;\ndrop policy if exists &amp;quot;cada um ve o seu&amp;quot; on public.jur_codigos;\ncreate policy &amp;quot;cada um ve o seu&amp;quot; on public.jur_codigos for all using (auth.uid() = user_id) with check (auth.uid() = user_id);\ndo $$ begin alter publication supabase_realtime add table public.jur_codigos; exception when others then null; end $$;\n\n-- jur_clientes: cadastro de clientes\ncreate table if not exists public.jur_clientes (\n  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,\n  id text not null,\n  titulo text,\n  dados jsonb,\n  apagado boolean not null default false,\n  atualizado bigint not null,\n  primary key (user_id, id)\n);\ncreate index if not exists jur_clientes_atualizado on public.jur_clientes (user_id, atualizado);\nalter table public.jur_clientes enable row level security;\ndrop policy if exists &amp;quot;cada um ve o seu&amp;quot; on public.jur_clientes;\ncreate policy &amp;quot;cada um ve o seu&amp;quot; on public.jur_clientes for all using (auth.uid() = user_id) with check (auth.uid() = user_id);\ndo $$ begin alter publication supabase_realtime add table public.jur_clientes; exception when others then null; end $$;\n\n-- jur_publicacoes: publicações do robô de prazos\ncreate table if not exists public.jur_publicacoes (\n  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,\n  id text not null,\n  titulo text,\n  dados jsonb,\n  apagado boolean not null default false,\n  atualizado bigint not null,\n  primary key (user_id, id)\n);\ncreate index if not exists jur_publicacoes_atualizado on public.jur_publicacoes (user_id, atualizado);\nalter table public.jur_publicacoes enable row level security;\ndrop policy if exists &amp;quot;cada um ve o seu&amp;quot; on public.jur_publicacoes;\ncreate policy &amp;quot;cada um ve o seu&amp;quot; on public.jur_publicacoes for all using (auth.uid() = user_id) with check (auth.uid() = user_id);\ndo $$ begin alter publication supabase_realtime add table public.jur_publicacoes; exception when others then null; end $$;\u003c/pre&gt;\n    \u003cp class=\&quot;sub\&quot;&gt;Não rode o passo 3 neste banco: lá as \&quot;janelas\&quot; têm os mesmos nomes destas tabelas.\u003c/p&gt;\n  \u003c/section&gt;\n\n  \u003csection class=\&quot;bloco\&quot;&gt;\n    \u003cdiv class=\&quot;passo\&quot;&gt;Conferir · só lê\u003c/div&gt;\n    \u003ch2&gt;Perguntas para ver se está tudo certo\u003c/h2&gt;\n    \u003cp&gt;Rode uma de cada vez. Nenhuma muda nada.\u003c/p&gt;\n    \u003cdiv class=\&quot;topo-codigo\&quot;&gt;\u003cspan&gt;Quanto tem em cada gaveta\u003c/span&gt;\u003cbutton class=\&quot;copiar\&quot; data-alvo=\&quot;sql4\&quot;&gt;📋 Copiar\u003c/button&gt;\u003c/div&gt;\n\u003cpre id=\&quot;sql4\&quot;&gt;select tipo, count(*) as quantos from public.mc_itens where not apagado group by tipo order by quantos desc;\u003c/pre&gt;\n    \u003cdiv class=\&quot;topo-codigo\&quot;&gt;\u003cspan&gt;As colunas da tabela principal\u003c/span&gt;\u003cbutton class=\&quot;copiar\&quot; data-alvo=\&quot;sql5\&quot;&gt;📋 Copiar\u003c/button&gt;\u003c/div&gt;\n\u003cpre id=\&quot;sql5\&quot;&gt;select column_name, data_type from information_schema.columns where table_name = 'mc_itens';\u003c/pre&gt;\n    \u003cdiv class=\&quot;topo-codigo\&quot;&gt;\u003cspan&gt;Quanto o banco ocupa na nuvem\u003c/span&gt;\u003cbutton class=\&quot;copiar\&quot; data-alvo=\&quot;sql6\&quot;&gt;📋 Copiar\u003c/button&gt;\u003c/div&gt;\n\u003cpre id=\&quot;sql6\&quot;&gt;select pg_size_pretty(pg_total_relation_size('public.mc_itens')) as tamanho;\u003c/pre&gt;\n  \u003c/section&gt;\n\n  \u003csection class=\&quot;bloco\&quot;&gt;\n    \u003ch2&gt;Se der erro\u003c/h2&gt;\n    \u003cul&gt;\n      \u003cli&gt;\u003cb&gt;\&quot;relation mc_itens does not exist\&quot;\u003c/b&gt;: falta o passo 1. Rode ele primeiro.\u003c/li&gt;\n      \u003cli&gt;\u003cb&gt;\&quot;syntax error\&quot;\u003c/b&gt;: um pedaço ficou de fora ao colar. Use o botão 📋 Copiar em vez de selecionar com o dedo.\u003c/li&gt;\n      \u003cli&gt;\u003cb&gt;\&quot;already exists\&quot;\u003c/b&gt;: não é problema. Quer dizer que já estava criado.\u003c/li&gt;\n      \u003cli&gt;O SQL Editor fica em \u003cb&gt;supabase.com\u003c/b&gt; → o seu projeto → ícone \u003cb&gt;SQL Editor\u003c/b&gt; no menu da esquerda. O site é em inglês: no Chrome, ⋮ → \u003cb&gt;Traduzir\u003c/b&gt;.\u003c/li&gt;\n    \u003c/ul&gt;\n  \u003c/section&gt;\n\u003c/main&gt;\n\n\u003cscript&gt;\ndocument.querySelectorAll('button.copiar').forEach((b) =&gt; {\n  b.addEventListener('click', async () =&gt; {\n    const pre = document.getElementById(b.dataset.alvo); const txt = pre.textContent;\n    let ok = false;\n    try { await navigator.clipboard.writeText(txt); ok = true; } catch (e) {\n      const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r);\n      try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }\n    }\n    const antes = '📋 Copiar';\n    b.textContent = ok ? '✅ Copiado' : '👆 Selecionado: toque em Copiar';\n    b.classList.toggle('ok', ok);\n    setTimeout(() =&gt; { b.textContent = antes; b.classList.remove('ok'); }, 2200);\n  });\n});\n\u003c/script&gt;\n\n\u003c/body&gt;\u003c/html&gt;&quot;},{&quot;nome&quot;:&quot;Esquema-do-Banco.html&quot;,&quot;src&quot;:&quot;\u003c!doctype html&gt;\u003chtml&gt;\u003chead&gt;\u003cscript&gt;(function(){var ME=\&quot;Esquema-do-Banco.html\&quot;;var D={};var S={getItem:function(k){return Object.prototype.hasOwnProperty.call(D,k)?D[k]:null},setItem:function(k,v){D[k]=String(v);parent.postMessage({brqLS:D,de:ME},\&quot;*\&quot;)},removeItem:function(k){delete D[k];parent.postMessage({brqLS:D,de:ME},\&quot;*\&quot;)},clear:function(){D={};parent.postMessage({brqLS:D,de:ME},\&quot;*\&quot;)},key:function(i){return Object.keys(D)[i]||null},get length(){return Object.keys(D).length}};try{window.localStorage.getItem(\&quot;x\&quot;)}catch(e){try{Object.defineProperty(window,\&quot;localStorage\&quot;,{value:S,configurable:true})}catch(e2){}}window.Brinquedo={nome:ME,enviar:function(para,dados){parent.postMessage({brq:1,de:ME,para:para||\&quot;*\&quot;,dados:dados},\&quot;*\&quot;)},receber:function(fn){window.addEventListener(\&quot;message\&quot;,function(e){var d=e.data;if(d&amp;&amp;d.brq&amp;&amp;d.de!==ME)fn(d.dados,d.de)})}};window.addEventListener(\&quot;message\&quot;,function(e){var d=e.data;if(!d||!d.brqCmd)return;if(d.brqCmd===\&quot;pegar\&quot;){var s=String(window.getSelection()||\&quot;\&quot;);if(!s.trim()){var c=document.querySelectorAll(\&quot;textarea,output,pre,#resultado,.resultado,#saida,.saida,#output,.output\&quot;);for(var i=c.length-1;i&gt;=0&amp;&amp;!s.trim();i--){s=c[i].value!=null&amp;&amp;c[i].tagName!==\&quot;OUTPUT\&quot;?c[i].value:c[i].innerText}}if(!s.trim())s=document.body.innerText;parent.postMessage({brqTexto:s,de:ME},\&quot;*\&quot;)}if(d.brqCmd===\&quot;colar\&quot;){var a=document.activeElement&amp;&amp;/^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName)?document.activeElement:document.querySelector(\&quot;textarea,input[type=text],input[type=search],input:not([type]),[contenteditable=true]\&quot;);if(a){if(\&quot;value\&quot; in a){a.value=d.texto;a.dispatchEvent(new Event(\&quot;input\&quot;,{bubbles:true}));a.dispatchEvent(new Event(\&quot;change\&quot;,{bubbles:true}))}else a.innerText=d.texto;a.focus&amp;&amp;a.focus()}parent.postMessage({brqColou:!!a,de:ME},\&quot;*\&quot;)}});})();\u003c/script&gt;\u003cmeta charset=utf8&gt;\u003cmeta name=viewport content=\&quot;width=device-width,initial-scale=1,viewport-fit=cover\&quot;&gt;\u003cstyle&gt;:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}\u003c/style&gt;\u003c/head&gt;\u003cbody&gt;\n\u003ctitle&gt;Esquema do Banco\u003c/title&gt;\n\u003cmeta name=\&quot;claude:viewport-fit-sides\&quot; content=\&quot;cover\&quot;&gt;\n\u003clink rel=\&quot;stylesheet\&quot; href=\&quot;https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Space+Grotesk:wght@600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap\&quot;&gt;\n\u003cstyle&gt;\n/* Layout: uma coluna de leitura; cada passo é um bloco com explicação curta, botão de copiar e o comando. Fichário de gavetas como metáfora. */\n:root {\n  --bg: #f4f6fa; --papel: #ffffff; --tinta: #1b2333; --mudo: #5d6779; --linha: #dde2ec;\n  --azul: #2457d6; --verde: #127a4f; --codigo-bg: #10192c; --codigo-tx: #dbe6ff; --aviso: #fff6dc; --aviso-borda: #e9c766;\n  --texto: \&quot;Inter\&quot;, system-ui, sans-serif; --titulo: \&quot;Space Grotesk\&quot;, \&quot;Inter\&quot;, sans-serif; --mono: \&quot;JetBrains Mono\&quot;, ui-monospace, monospace;\n}\n@media (prefers-color-scheme: dark) { :root:not([data-theme=\&quot;light\&quot;]) {\n  --bg: #0f1522; --papel: #172033; --tinta: #e7ecf6; --mudo: #9aa6bb; --linha: #2a3650; --azul: #7aa2ff; --verde: #4fd3a0; --codigo-bg: #0a1020; --codigo-tx: #dbe6ff; --aviso: #2b2614; --aviso-borda: #7d6a2c; color-scheme: dark } }\n:root[data-theme=\&quot;dark\&quot;] { --bg: #0f1522; --papel: #172033; --tinta: #e7ecf6; --mudo: #9aa6bb; --linha: #2a3650; --azul: #7aa2ff; --verde: #4fd3a0; --codigo-bg: #0a1020; --codigo-tx: #dbe6ff; --aviso: #2b2614; --aviso-borda: #7d6a2c; color-scheme: dark }\n* { box-sizing: border-box; }\nbody { background: var(--bg); color: var(--tinta); font: 16px/1.55 var(--texto); padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overscroll-behavior: none; }\nmain { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }\nh1 { font: 700 30px/1.15 var(--titulo); margin: 0; text-wrap: balance; }\nh2 { font: 700 21px/1.25 var(--titulo); margin: 0; text-wrap: balance; }\np { margin: 0; }\n.sub { color: var(--mudo); }\n.bloco { background: var(--papel); border: 1px solid var(--linha); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }\n.passo { font: 600 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--azul); }\n.aviso { background: var(--aviso); border: 1px solid var(--aviso-borda); border-radius: 12px; padding: 12px 14px; }\n.topo-codigo { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }\n.topo-codigo span { color: var(--mudo); font-size: 14px; flex: 1; min-width: 0; }\nbutton.copiar { font: 600 16px var(--texto); background: var(--azul); color: #fff; border: 0; border-radius: 10px; padding: 10px 16px; min-height: 44px; cursor: pointer; }\nbutton.copiar.ok { background: var(--verde); }\nbutton.copiar:focus-visible { outline: 3px solid var(--tinta); outline-offset: 2px; }\npre { margin: 0; background: var(--codigo-bg); color: var(--codigo-tx); border-radius: 10px; padding: 12px; overflow-x: auto; font: 13px/1.5 var(--mono); max-height: 340px; }\nul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }\ntable { border-collapse: collapse; width: 100%; font-size: 15px; }\n.tabela { overflow-x: auto; }\ntd, th { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--linha); vertical-align: top; }\nth { font-weight: 600; color: var(--mudo); font-size: 13px; }\ncode { font-family: var(--mono); font-size: .92em; }\n.gaveta { font-family: var(--mono); color: var(--azul); white-space: nowrap; }\n\u003c/style&gt;\n\n\u003cmain&gt;\n  \u003cheader style=\&quot;display:flex;flex-direction:column;gap:6px\&quot;&gt;\n    \u003ch1&gt;Esquema do Banco\u003c/h1&gt;\n    \u003cp class=\&quot;sub\&quot;&gt;Meu Chat + SK Jurídico · Supabase do Maikon · versão 23/11\u003c/p&gt;\n  \u003c/header&gt;\n\n  \u003csection class=\&quot;aviso\&quot;&gt;\n    \u003cp&gt;\u003cb&gt;Pode rodar quantas vezes quiser: nada é apagado.\u003c/b&gt; Todos os comandos daqui usam \u003ccode&gt;if not exists\u003c/code&gt; (só cria o que ainda não existe) ou \u003ccode&gt;create or replace view\u003c/code&gt; (só troca a \&quot;janela\&quot;, não os dados). As suas conversas, códigos e documentos continuam onde estão.\u003c/p&gt;\n  \u003c/section&gt;\n\n  \u003csection class=\&quot;bloco\&quot;&gt;\n    \u003ch2&gt;Como o banco é organizado\u003c/h2&gt;\n    \u003cp&gt;É um \u003cb&gt;arquivo de aço com gavetas\u003c/b&gt;. A tabela de verdade é uma só, a \u003ccode&gt;mc_itens\u003c/code&gt;. A coluna \u003cb&gt;tipo\u003c/b&gt; diz em qual gaveta cada coisa está. Coisa nova não precisa de tabela nova: é só uma gaveta nova.\u003c/p&gt;\n    \u003cdiv class=\&quot;tabela\&quot;&gt;\u003ctable&gt;\n      \u003ctr&gt;\u003cth&gt;Gaveta (tipo)\u003c/th&gt;\u003cth&gt;O que guarda\u003c/th&gt;\u003c/tr&gt;\n      \u003ctr&gt;\u003ctd class=\&quot;gaveta\&quot;&gt;conversa\u003c/td&gt;\u003ctd&gt;💬 cada conversa do Meu Chat\u003c/td&gt;\u003c/tr&gt;\n      \u003ctr&gt;\u003ctd class=\&quot;gaveta\&quot;&gt;codigo\u003c/td&gt;\u003ctd&gt;🧪 os códigos do playground\u003c/td&gt;\u003c/tr&gt;\n      \u003ctr&gt;\u003ctd class=\&quot;gaveta\&quot;&gt;memoria · prefs · links\u003c/td&gt;\u003ctd&gt;🧠 memória, ⚙️ configurações, 🔗 links\u003c/td&gt;\u003c/tr&gt;\n      \u003ctr&gt;\u003ctd class=\&quot;gaveta\&quot;&gt;cofre\u003c/td&gt;\u003ctd&gt;🔐 chaves e senhas, \u003cb&gt;trancadas\u003c/b&gt; com a senha do login\u003c/td&gt;\u003c/tr&gt;\n      \u003ctr&gt;\u003ctd class=\&quot;gaveta\&quot;&gt;jur:documentos · jur:modelos\u003c/td&gt;\u003ctd&gt;⚖️ peças e modelos do jurídico\u003c/td&gt;\u003c/tr&gt;\n      \u003ctr&gt;\u003ctd class=\&quot;gaveta\&quot;&gt;jur:ementas\u003c/td&gt;\u003ctd&gt;📚 ementas e jurisprudência que você guardou\u003c/td&gt;\u003c/tr&gt;\n      \u003ctr&gt;\u003ctd class=\&quot;gaveta\&quot;&gt;jur:historico · jur:conversas\u003c/td&gt;\u003ctd&gt;🕘 histórico e conversas do jurídico\u003c/td&gt;\u003c/tr&gt;\n      \u003ctr&gt;\u003ctd class=\&quot;gaveta\&quot;&gt;jur:regras · jur:codigos\u003c/td&gt;\u003ctd&gt;📏 regras (e o pacote) e códigos do jurídico\u003c/td&gt;\u003c/tr&gt;\n      \u003ctr&gt;\u003ctd class=\&quot;gaveta\&quot;&gt;jur:prefs\u003c/td&gt;\u003ctd&gt;👤 seus dados, 📄 modelos do Word, 🤖 clientes do robô\u003c/td&gt;\u003c/tr&gt;\n    \u003c/table&gt;\u003c/div&gt;\n    \u003cp class=\&quot;sub\&quot;&gt;\u003cb&gt;E-mail e senha\u003c/b&gt; ficam numa tabela própria do Supabase, a \u003ccode&gt;auth.users\u003c/code&gt; (em \u003cb&gt;Authentication → Users\u003c/b&gt;). A senha fica embaralhada: ninguém consegue ler, nem você, nem o Supabase. Isso é igual em qualquer sistema sério, inclusive na Replit.\u003c/p&gt;\n  \u003c/section&gt;\n\n  \u003csection class=\&quot;bloco\&quot;&gt;\n    \u003cdiv class=\&quot;passo\&quot;&gt;Passo 1 · obrigatório, uma vez\u003c/div&gt;\n    \u003ch2&gt;A tabela principal + o \&quot;ao vivo\&quot;\u003c/h2&gt;\n    \u003cp&gt;Cria a \u003ccode&gt;mc_itens\u003c/code&gt;, a trava \&quot;cada um vê só o seu\&quot; e liga o ao vivo (o que você escreve num aparelho aparece no outro).\u003c/p&gt;\n    \u003cdiv class=\&quot;topo-codigo\&quot;&gt;\u003cspan&gt;Supabase → SQL Editor → New query → cole → Run\u003c/span&gt;\u003cbutton class=\&quot;copiar\&quot; data-alvo=\&quot;sql1\&quot;&gt;📋 Copiar\u003c/button&gt;\u003c/div&gt;\n\u003cpre id=\&quot;sql1\&quot;&gt;create table if not exists public.mc_itens (\n  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,\n  tipo text not null,\n  id text not null,\n  dados jsonb,\n  apagado boolean not null default false,\n  atualizado bigint not null,\n  primary key (user_id, tipo, id)\n);\ncreate index if not exists mc_itens_atualizado on public.mc_itens (user_id, atualizado);\nalter table public.mc_itens enable row level security;\ndrop policy if exists \&quot;cada um ve o seu\&quot; on public.mc_itens;\ncreate policy \&quot;cada um ve o seu\&quot; on public.mc_itens for all\n  using (auth.uid() = user_id) with check (auth.uid() = user_id);\ndo $$ begin alter publication supabase_realtime add table public.mc_itens; exception when others then null; end $$;\u003c/pre&gt;\n    \u003cp class=\&quot;sub\&quot;&gt;A linha \u003ccode&gt;drop policy\u003c/code&gt; apaga só a \u003cb&gt;regra de acesso antiga\u003c/b&gt; para pôr a nova no lugar. Nenhum dado sai.\u003c/p&gt;\n  \u003c/section&gt;\n\n  \u003csection class=\&quot;bloco\&quot;&gt;\n    \u003cdiv class=\&quot;passo\&quot;&gt;Passo 2 · opcional\u003c/div&gt;\n    \u003ch2&gt;Janelas do Meu Chat (para ver como tabelas, igual na Replit)\u003c/h2&gt;\n    \u003cp&gt;Cria \&quot;janelas\&quot; que mostram cada gaveta como uma tabela separada no \u003cb&gt;Table Editor\u003c/b&gt;: \u003ccode&gt;mc_conversas\u003c/code&gt;, \u003ccode&gt;mc_codigos\u003c/code&gt;, \u003ccode&gt;mc_memoria\u003c/code&gt;, \u003ccode&gt;mc_links\u003c/code&gt; e \u003ccode&gt;mc_cofre\u003c/code&gt;. Elas só \u003cb&gt;mostram\u003c/b&gt;: o app continua gravando na \u003ccode&gt;mc_itens\u003c/code&gt;.\u003c/p&gt;\n    \u003cdiv class=\&quot;topo-codigo\&quot;&gt;\u003cspan&gt;Rode depois do passo 1\u003c/span&gt;\u003cbutton class=\&quot;copiar\&quot; data-alvo=\&quot;sql2\&quot;&gt;📋 Copiar\u003c/button&gt;\u003c/div&gt;\n\u003cpre id=\&quot;sql2\&quot;&gt;create or replace view public.mc_conversas with (security_invoker = on) as\n  select id, dados-&gt;&gt;'titulo' as titulo, dados-&gt;&gt;'nMsgs' as mensagens,\n         to_timestamp(atualizado / 1000.0) as atualizado\n  from public.mc_itens where tipo = 'conversa' and not apagado;\n\ncreate or replace view public.mc_codigos with (security_invoker = on) as\n  select id, dados-&gt;&gt;'nome' as nome, dados-&gt;&gt;'lang' as linguagem, dados-&gt;&gt;'codigo' as codigo,\n         to_timestamp(atualizado / 1000.0) as atualizado\n  from public.mc_itens where tipo = 'codigo' and not apagado;\n\ncreate or replace view public.mc_memoria with (security_invoker = on) as\n  select dados-&gt;&gt;'texto' as memoria, to_timestamp(atualizado / 1000.0) as atualizado\n  from public.mc_itens where tipo = 'memoria' and not apagado;\n\ncreate or replace view public.mc_links with (security_invoker = on) as\n  select l-&gt;&gt;'nome' as nome, l-&gt;&gt;'url' as endereco\n  from public.mc_itens, jsonb_array_elements(coalesce(dados-&gt;'lista', '[]'::jsonb)) as l\n  where tipo = 'links' and not apagado;\n\ncreate or replace view public.mc_cofre with (security_invoker = on) as\n  select id, 'trancado com a senha do login' as conteudo, to_timestamp(atualizado / 1000.0) as atualizado\n  from public.mc_itens where tipo = 'cofre' and not apagado;\u003c/pre&gt;\n  \u003c/section&gt;\n\n  \u003csection class=\&quot;bloco\&quot;&gt;\n    \u003cdiv class=\&quot;passo\&quot;&gt;Passo 3 · opcional\u003c/div&gt;\n    \u003ch2&gt;Janelas do SK Jurídico\u003c/h2&gt;\n    \u003cp&gt;Uma tabela para cada parte do jurídico: \u003ccode&gt;jur_documentos\u003c/code&gt;, \u003ccode&gt;jur_modelos\u003c/code&gt;, \u003ccode&gt;jur_ementas\u003c/code&gt; (a jurisprudência), \u003ccode&gt;jur_historico\u003c/code&gt;, \u003ccode&gt;jur_conversas\u003c/code&gt;, \u003ccode&gt;jur_regras\u003c/code&gt;, \u003ccode&gt;jur_codigos\u003c/code&gt;, \u003ccode&gt;jur_robo_clientes\u003c/code&gt; (os clientes do 🤖 robô de prazos) e \u003ccode&gt;jur_modelos_word\u003c/code&gt; (os seus Word com cabeçalho e rodapé).\u003c/p&gt;\n    \u003cdiv class=\&quot;topo-codigo\&quot;&gt;\u003cspan&gt;Rode depois do passo 1\u003c/span&gt;\u003cbutton class=\&quot;copiar\&quot; data-alvo=\&quot;sql3\&quot;&gt;📋 Copiar\u003c/button&gt;\u003c/div&gt;\n\u003cpre id=\&quot;sql3\&quot;&gt;create or replace view public.jur_documentos with (security_invoker = on) as\n  select id, dados-&gt;&gt;'titulo' as titulo, dados-&gt;&gt;'html' as texto, to_timestamp(atualizado / 1000.0) as atualizado\n  from public.mc_itens where tipo = 'jur:documentos' and not apagado;\n\ncreate or replace view public.jur_modelos with (security_invoker = on) as\n  select id, dados-&gt;&gt;'titulo' as titulo, dados-&gt;&gt;'categoria' as categoria, dados-&gt;&gt;'html' as texto, to_timestamp(atualizado / 1000.0) as atualizado\n  from public.mc_itens where tipo = 'jur:modelos' and not apagado;\n\ncreate or replace view public.jur_ementas with (security_invoker = on) as\n  select id, dados-&gt;&gt;'titulo' as titulo, dados-&gt;&gt;'categoria' as categoria, coalesce(dados-&gt;&gt;'texto', dados-&gt;&gt;'md') as texto, to_timestamp(atualizado / 1000.0) as atualizado\n  from public.mc_itens where tipo = 'jur:ementas' and not apagado;\n\ncreate or replace view public.jur_historico with (security_invoker = on) as\n  select id, dados-&gt;&gt;'titulo' as titulo, to_timestamp(atualizado / 1000.0) as atualizado, dados\n  from public.mc_itens where tipo = 'jur:historico' and not apagado;\n\ncreate or replace view public.jur_conversas with (security_invoker = on) as\n  select id, dados-&gt;&gt;'titulo' as titulo, to_timestamp(atualizado / 1000.0) as atualizado, dados\n  from public.mc_itens where tipo = 'jur:conversas' and not apagado;\n\ncreate or replace view public.jur_regras with (security_invoker = on) as\n  select id, dados-&gt;&gt;'tipo' as tipo, dados-&gt;&gt;'titulo' as titulo, dados-&gt;&gt;'ativa' as ligada, dados-&gt;&gt;'texto' as texto\n  from public.mc_itens where tipo = 'jur:regras' and not apagado;\n\ncreate or replace view public.jur_codigos with (security_invoker = on) as\n  select id, coalesce(dados-&gt;&gt;'titulo', dados-&gt;&gt;'nome') as nome, dados-&gt;&gt;'codigo' as codigo, to_timestamp(atualizado / 1000.0) as atualizado\n  from public.mc_itens where tipo = 'jur:codigos' and not apagado;\n\ncreate or replace view public.jur_robo_clientes with (security_invoker = on) as\n  select c-&gt;&gt;'processo' as processo, c-&gt;&gt;'nome_completo' as nome, c-&gt;&gt;'email' as email,\n         c-&gt;&gt;'telefone' as telefone, c-&gt;&gt;'tratamento' as tratamento, c-&gt;&gt;'nome_caso' as caso\n  from public.mc_itens,\n       jsonb_array_elements(case when jsonb_typeof(dados-&gt;'djen:clientes') = 'array' then dados-&gt;'djen:clientes' else '[]'::jsonb end) as c\n  where tipo = 'jur:prefs' and not apagado;\n\ncreate or replace view public.jur_modelos_word with (security_invoker = on) as\n  select m-&gt;&gt;'nome' as nome, to_timestamp((m-&gt;&gt;'criado')::bigint / 1000.0) as importado\n  from public.mc_itens,\n       jsonb_array_elements(case when jsonb_typeof(dados-&gt;'timbrados') = 'array' then dados-&gt;'timbrados' else '[]'::jsonb end) as m\n  where tipo = 'jur:prefs' and not apagado;\u003c/pre&gt;\n  \u003c/section&gt;\n\n  \u003csection class=\&quot;bloco\&quot;&gt;\n    \u003cdiv class=\&quot;passo\&quot;&gt;Conferir · só lê\u003c/div&gt;\n    \u003ch2&gt;Perguntas para ver se está tudo certo\u003c/h2&gt;\n    \u003cp&gt;Rode uma de cada vez. Nenhuma muda nada.\u003c/p&gt;\n    \u003cdiv class=\&quot;topo-codigo\&quot;&gt;\u003cspan&gt;Quanto tem em cada gaveta\u003c/span&gt;\u003cbutton class=\&quot;copiar\&quot; data-alvo=\&quot;sql4\&quot;&gt;📋 Copiar\u003c/button&gt;\u003c/div&gt;\n\u003cpre id=\&quot;sql4\&quot;&gt;select tipo, count(*) as quantos from public.mc_itens where not apagado group by tipo order by quantos desc;\u003c/pre&gt;\n    \u003cdiv class=\&quot;topo-codigo\&quot;&gt;\u003cspan&gt;As colunas da tabela principal\u003c/span&gt;\u003cbutton class=\&quot;copiar\&quot; data-alvo=\&quot;sql5\&quot;&gt;📋 Copiar\u003c/button&gt;\u003c/div&gt;\n\u003cpre id=\&quot;sql5\&quot;&gt;select column_name, data_type from information_schema.columns where table_name = 'mc_itens';\u003c/pre&gt;\n    \u003cdiv class=\&quot;topo-codigo\&quot;&gt;\u003cspan&gt;Quanto o banco ocupa na nuvem\u003c/span&gt;\u003cbutton class=\&quot;copiar\&quot; data-alvo=\&quot;sql6\&quot;&gt;📋 Copiar\u003c/button&gt;\u003c/div&gt;\n\u003cpre id=\&quot;sql6\&quot;&gt;select pg_size_pretty(pg_total_relation_size('public.mc_itens')) as tamanho;\u003c/pre&gt;\n  \u003c/section&gt;\n\n  \u003csection class=\&quot;bloco\&quot;&gt;\n    \u003ch2&gt;Se der erro\u003c/h2&gt;\n    \u003cul&gt;\n      \u003cli&gt;\u003cb&gt;\&quot;relation mc_itens does not exist\&quot;\u003c/b&gt;: falta o passo 1. Rode ele primeiro.\u003c/li&gt;\n      \u003cli&gt;\u003cb&gt;\&quot;syntax error\&quot;\u003c/b&gt;: um pedaço ficou de fora ao colar. Use o botão 📋 Copiar em vez de selecionar com o dedo.\u003c/li&gt;\n      \u003cli&gt;\u003cb&gt;\&quot;already exists\&quot;\u003c/b&gt;: não é problema. Quer dizer que já estava criado.\u003c/li&gt;\n      \u003cli&gt;O SQL Editor fica em \u003cb&gt;supabase.com\u003c/b&gt; → o seu projeto → ícone \u003cb&gt;SQL Editor\u003c/b&gt; no menu da esquerda. O site é em inglês: no Chrome, ⋮ → \u003cb&gt;Traduzir\u003c/b&gt;.\u003c/li&gt;\n    \u003c/ul&gt;\n  \u003c/section&gt;\n\u003c/main&gt;\n\n\u003cscript&gt;\ndocument.querySelectorAll('button.copiar').forEach((b) =&gt; {\n  b.addEventListener('click', async () =&gt; {\n    const pre = document.getElementById(b.dataset.alvo); const txt = pre.textContent;\n    let ok = false;\n    try { await navigator.clipboard.writeText(txt); ok = true; } catch (e) {\n      const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r);\n      try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }\n    }\n    const antes = '📋 Copiar';\n    b.textContent = ok ? '✅ Copiado' : '👆 Selecionado: toque em Copiar';\n    b.classList.toggle('ok', ok);\n    setTimeout(() =&gt; { b.textContent = antes; b.classList.remove('ok'); }, 2200);\n  });\n});\n\u003c/script&gt;\n\n\u003c/body&gt;\u003c/html&gt;&quot;},{&quot;nome&quot;:&quot;SQL.html&quot;,&quot;src&quot;:&quot;\u003c!DOCTYPE html&gt;\n\u003chtml lang=\&quot;pt-BR\&quot;&gt;\n\u003chead&gt;\u003cscript&gt;(function(){var ME=\&quot;SQL.html\&quot;;var D={};var S={getItem:function(k){return Object.prototype.hasOwnProperty.call(D,k)?D[k]:null},setItem:function(k,v){D[k]=String(v);parent.postMessage({brqLS:D,de:ME},\&quot;*\&quot;)},removeItem:function(k){delete D[k];parent.postMessage({brqLS:D,de:ME},\&quot;*\&quot;)},clear:function(){D={};parent.postMessage({brqLS:D,de:ME},\&quot;*\&quot;)},key:function(i){return Object.keys(D)[i]||null},get length(){return Object.keys(D).length}};try{window.localStorage.getItem(\&quot;x\&quot;)}catch(e){try{Object.defineProperty(window,\&quot;localStorage\&quot;,{value:S,configurable:true})}catch(e2){}}window.Brinquedo={nome:ME,enviar:function(para,dados){parent.postMessage({brq:1,de:ME,para:para||\&quot;*\&quot;,dados:dados},\&quot;*\&quot;)}, font-size: 0.85rem;\n    margin-bottom: 24px;\n  }\n  .drop-area {\n    border: 2px dashed #7c9ef8;\n    border-radius: 12px;\n    padding: 40px 20px;\n    text-align: center;\n    cursor: pointer;\n    transition: all 0.3s;\n    background: #1a1d2e;\n    margin-bottom: 20px;\n  }\n  .drop-area:hover, .drop-area.ativo {\n    background: #1e2340;\n    border-color: #a0b4ff;\n  }\n  .drop-area p { color: #aaa; font-size: 0.95rem; }\n  .drop-area span { font-size: 2.5rem; display: block; margin-bottom: 10px; }\n  input[type=\&quot;file\&quot;] { display: none; }\n  .resultado {\n    display: none;\n    background: #1a1d2e;\n    border-radius: 12px;\n    padding: 16px;\n    margin-bottom: 16px;\n  }\n  .resultado.visivel { display: block; }\n  .arquivo-titulo {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    margin-bottom: 10px;\n    flex-wrap: wrap;\n    gap: 8px;\n  }\n  .arquivo-titulo h3 {\n    color: #7c9ef8;\n    font-size: 0.95rem;\n    word-break: break-all;\n  }\n  .btn-copiar {\n    background: #2a3a6e;\n    color: #a0b4ff;\n    border: 1px solid #3a4a8e;\n    border-radius: 8px;\n    padding: 6px 14px;\n    cursor: pointer;\n    font-size: 0.8rem;\n    white-space: nowrap;\n  }\n  .btn-copiar:hover { background: #3a4a9e; }\n  .btn-copiar.copiado {\n    background: #1a4a2e;\n    color: #4caf50;\n    border-color: #4caf50;\n  }\n  pre {\n    background: #0d1117;\n    border-radius: 8px;\n    padding: 14px;\n    overflow-x: auto;\n    font-size: 0.78rem;\n    line-height: 1.6;\n    color: #c9d1d9;\n    max-height: 400px;\n    overflow-y: auto;\n    white-space: pre-wrap;\n    word-break: break-word;\n  }\n  .status {\n    text-align: center;\n    padding: 12px;\n    border-radius: 8px;\n    margin-bottom: 16px;\n    display: none;\n  }\n  .status.visivel { display: block; }\n  .status.ok { background: #1a3a2e; color: #4caf50; }\n  .status.erro { background: #3a1a1a; color: #f44336; }\n  .status.aviso { background: #3a2a1a; color: #ff9800; }\n  .nenhum {\n    text-align: center;\n    color: #888;\n    padding: 20px;\n    display: none;\n  }\n  .nenhum.visivel { display: block; }\n  .contador {\n    text-align: center;\n    color: #7c9ef8;\n    font-size: 0.85rem;\n    margin-bottom: 16px;\n    display: none;\n  }\n  .contador.visivel { display: block; }\n  .btn-limpar {\n    display: block;\n    margin: 0 auto 20px;\n    background: #2a1a1a;\n    color: #f44336;\n    border: 1px solid #4a2a2a;\n    border-radius: 8px;\n    padding: 8px 20px;\n    cursor: pointer;\n    font-size: 0.85rem;\n    display: none;\n  }\n  .btn-limpar.visivel { display: block; }\n  .dica {\n    background: #1a2a1a;\n    border: 1px solid #2a4a2a;\n    border-radius: 8px;\n    padding: 12px 16px;\n    margin-bottom: 20px;\n    font-size: 0.82rem;\n    color: #aaa;\n    line-height: 1.6;\n  }\n  .dica strong { color: #4caf50; }\n\u003c/style&gt;\n\u003c/head&gt;\n\u003cbody&gt;\n\n\u003ch1&gt;🔍 Caça Esquema SQL\u003c/h1&gt;\n\u003cp class=\&quot;sub\&quot;&gt;Encontra arquivos SQL dentro de qualquer ZIP de projeto\u003c/p&gt;\n\n\u003cdiv class=\&quot;dica\&quot;&gt;\n  \u003cstrong&gt;Como usar:\u003c/strong&gt; Arraste o ZIP do seu projeto na área abaixo ou clique para selecionar. \n  O programa vai procurar automaticamente todos os arquivos \u003cstrong&gt;.sql\u003c/strong&gt;, \n  \u003cstrong&gt;schema\u003c/strong&gt;, \u003cstrong&gt;migration\u003c/strong&gt; e \u003cstrong&gt;database\u003c/strong&gt; dentro do ZIP \n  e mostrar o conteúdo para você copiar e colar no Supabase.\n\u003c/div&gt;\n\n\u003cdiv class=\&quot;drop-area\&quot; id=\&quot;dropArea\&quot;&gt;\n  \u003cspan&gt;📦\u003c/span&gt;\n  \u003cp&gt;Arraste o ZIP do projeto aqui\u003c/p&gt;\n  \u003cp style=\&quot;margin-top:8px; font-size:0.8rem;\&quot;&gt;ou clique para selecionar\u003c/p&gt;\n  \u003cinput type=\&quot;file\&quot; id=\&quot;inputArquivo\&quot; accept=\&quot;.zip\&quot;&gt;\n\u003c/div&gt;\n\n\u003cdiv class=\&quot;status\&quot; id=\&quot;status\&quot;&gt;\u003c/div&gt;\n\u003cdiv class=\&quot;contador\&quot; id=\&quot;contador\&quot;&gt;\u003c/div&gt;\n\u003cbutton class=\&quot;btn-limpar\&quot; id=\&quot;btnLimpar\&quot;&gt;🗑️ Limpar e tentar outro ZIP\u003c/button&gt;\n\u003cdiv class=\&quot;nenhum\&quot; id=\&quot;nenhum\&quot;&gt;\n  ⚠️ Nenhum arquivo SQL encontrado neste ZIP.\u003cbr&gt;\n  \u003cspan style=\&quot;font-size:0.8rem; color:#666;\&quot;&gt;O projeto pode não usar banco de dados ou os arquivos têm outro nome.\u003c/span&gt;\n\u003c/div&gt;\n\u003cdiv id=\&quot;resultados\&quot;&gt;\u003c/div&gt;\n\n\u003cscript&gt;\nconst dropArea = document.getElementById('dropArea');\nconst inputArquivo = document.getElementById('inputArquivo');\nconst statusEl = document.getElementById('status');\nconst contadorEl = document.getElementById('contador');\nconst resultadosEl = document.getElementById('resultados');\nconst nenhumEl = document.getElementById('nenhum');\nconst btnLimpar = document.getElementById('btnLimpar');\n\n// Palavras que indicam arquivo de banco de dados\nconst PALAVRAS_CHAVE = [\n  '.sql',\n  'schema',\n  'migration',\n  'database',\n  'db.js',\n  'db.ts',\n  'supabase',\n  'neon',\n  'postgres',\n  'knex',\n  'sequelize',\n  'prisma'\n];\n\n// Clique na área\ndropArea.addEventListener('click', () =&gt; inputArquivo.click());\n\n// Drag and drop\ndropArea.addEventListener('dragover', (e) =&gt; {\n  e.preventDefault();\n  dropArea.classList.add('ativo');\n});\ndropArea.addEventListener('dragleave', () =&gt; dropArea.classList.remove('ativo'));\ndropArea.addEventListener('drop', (e) =&gt; {\n  e.preventDefault();\n  dropArea.classList.remove('ativo');\n  const arquivo = e.dataTransfer.files[0];\n  if (arquivo) processarZip(arquivo);\n});\n\n// Seleção normal\ninputArquivo.addEventListener('change', (e) =&gt; {\n  if (e.target.files[0]) processarZip(e.target.files[0]);\n});\n\n// Limpar\nbtnLimpar.addEventListener('click', () =&gt; {\n  resultadosEl.innerHTML = '';\n  statusEl.className = 'status';\n  contadorEl.className = 'contador';\n  nenhumEl.className = 'nenhum';\n  btnLimpar.className = 'btn-limpar';\n  inputArquivo.value = '';\n});\n\nasync function processarZip(arquivo) {\n  if (!arquivo.name.endsWith('.zip')) {\n    mostrarStatus('❌ Por favor selecione um arquivo .zip', 'erro');\n    return;\n  }\n\n  mostrarStatus('⏳ Lendo o ZIP... aguarde...', 'aviso');\n  resultadosEl.innerHTML = '';\n  nenhumEl.className = 'nenhum';\n\n  try {\n    const zip = await JSZip.loadAsync(arquivo);\n    const arquivosEncontrados = [];\n\n    // Percorre todos os arquivos do ZIP\n    zip.forEach((caminho, arquivo) =&gt; {\n      if (arquivo.dir) return;\n      const caminhoLower = caminho.toLowerCase();\n      const temPalavraChave = PALAVRAS_CHAVE.some(p =&gt; caminhoLower.includes(p));\n      if (temPalavraChave) {\n        arquivosEncontrados.push({ caminho, arquivo });\n      }\n    });\n\n    if (arquivosEncontrados.length === 0) {\n      mostrarStatus('✅ ZIP lido com sucesso', 'ok');\n      nenhumEl.className = 'nenhum visivel';\n      btnLimpar.className = 'btn-limpar visivel';\n      return;\n    }\n\n    mostrarStatus(`✅ ZIP lido! Encontrei ${arquivosEncontrados.length} arquivo(s) relacionado(s) a banco de dados`, 'ok');\n    contadorEl.textContent = `📋 ${arquivosEncontrados.length} arquivo(s) encontrado(s)`;\n    contadorEl.className = 'contador visivel';\n    btnLimpar.className = 'btn-limpar visivel';\n\n    // Lê e mostra cada arquivo\n    for (const { caminho, arquivo } of arquivosEncontrados) {\n      try {\n        const conteudo = await arquivo.async('string');\n        criarBloco(caminho, conteudo);\n      } catch (e) {\n        criarBloco(caminho, '⚠️ Não foi possível ler este arquivo (pode ser binário)');\n      }\n    }\n\n  } catch (err) {\n    mostrarStatus('❌ Erro ao ler o ZIP: ' + err.message, 'erro');\n  }\n}\n\nfunction criarBloco(caminho, conteudo) {\n  const div = document.createElement('div');\n  div.className = 'resultado visivel';\n\n  const btnId = 'btn_' + Math.random().toString(36).substr(2, 9);\n\n  div.innerHTML = `\n    \u003cdiv class=\&quot;arquivo-titulo\&quot;&gt;\n      \u003ch3&gt;📄 ${caminho}\u003c/h3&gt;\n      \u003cbutton class=\&quot;btn-copiar\&quot; id=\&quot;${btnId}\&quot; onclick=\&quot;copiar('${btnId}', \\`${escapar(conteudo)}\\`)\&quot;&gt;\n        📋 Copiar tudo\n      \u003c/button&gt;\n    \u003c/div&gt;\n    \u003cpre&gt;${escaparHTML(conteudo)}\u003c/pre&gt;\n  `;\n\n  resultadosEl.appendChild(div);\n}\n\nfunction copiar(btnId, conteudo) {\n  navigator.clipboard.writeText(conteudo).then(() =&gt; {\n    const btn = document.getElementById(btnId);\n    btn.textContent = '✅ Copiado!';\n    btn.classList.add('copiado');\n    setTimeout(() =&gt; {\n      btn.textContent = '📋 Copiar tudo';\n      btn.classList.remove('copiado');\n    }, 2000);\n  }).catch(() =&gt; {\n    alert('Não foi possível copiar automaticamente. Selecione o texto manualmente.');\n  });\n}\n\nfunction escapar(str) {\n  return str.replace(/\\\\/g, '\\\\\\\\').replace(/`/g, '\\\\`').replace(/\\$/g, '\\\\$');\n}\n\nfunction escaparHTML(str) {\n  return str\n    .replace(/&amp;/g, '&amp;amp;')\n    .replace(/\u003c/g, '&amp;lt;')\n    .replace(/&gt;/g, '&amp;gt;');\n}\n\nfunction mostrarStatus(msg, tipo) {\n  statusEl.textContent = msg;\n  statusEl.className = `status visivel ${tipo}`;\n}\n\u003c/script&gt;\n\u003c/body&gt;\n\u003c/html&gt;\n&quot;}];P.forEach(function(x,i){document.getElementById(&quot;f&quot;+i).srcdoc=x.src});var mao=document.getElementById(&quot;mao&quot;);document.onclick=function(e){var b=e.target.closest(&quot;[data-p],[data-c]&quot;);if(!b)return;var i=+(b.dataset.p||b.dataset.c);var f=document.getElementById(&quot;f&quot;+i).contentWindow;if(b.dataset.p!=null)f.postMessage({brqCmd:&quot;pegar&quot;},&quot;*&quot;);else f.postMessage({brqCmd:&quot;colar&quot;,texto:mao.value},&quot;*&quot;)};window.onmessage=function(e){var d=e.data||{};if(d.brqTexto!=null)mao.value=d.brqTexto;if(d.brq)P.forEach(function(x,i){if(d.para===&quot;*&quot;||d.para===x.nome)document.getElementById(&quot;f&quot;+i).contentWindow.postMessage(d,&quot;*&quot;)})};&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>

&lt;style&gt;
/* ============================================================
   BASE / VARIÁVEIS
   ============================================================ */
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--border:#30363d;
  --text:#c9d1d9;--text2:#8b949e;--accent:#58a6ff;--green:#3fb950;

}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
button,select,input,textarea{font-family:inherit}
.hidden{display:none!important}

/* ============================================================
   COMPONENTES
   ============================================================ */
select,input[type=text],input[type=password],input[type=number],input[type=search]{
  background:var(--bg3);border:1px solid var(--border);color:var(--text);
  padding:5px 9px;border-radius:6px;font-size:12px;outline:none;min-height:32px}
select:focus,input:focus,textarea:focus{border-color:var(--accent)}
.btn{padding:5px 10px;min-height:32px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);
  color:var(--text);cursor:pointer;font-size:12px;white-space:nowrap;transition:background .15s;touch-action:manipulation}
.btn:hover{background:var(--border)}
.btn.icon{padding:4px 8px;font-size:15px}
.btn.sm{min-height:24px;padding:2px 7px;font-size:11px}
.btn.primary{background:var(--accent);color:#000;border-color:var(--accent)}
.btn.danger{background:var(--red);color:#fff;border-color:var(--red)}
.btn.success{background:var(--green);color:#000;border-color:var(--green)}
.btn.warn{background:var(--yellow);color:#000;border-color:var(--yellow)}
.btn.on{border-color:var(--accent);color:var(--accent);background:rgba(88,166,255,.14)}
.btn.rec{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1.2s infinite}
.btn:disabled{opacity:.4;cursor:not-allowed}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

/* ============================================================
   HEADER (compacto, 1 linha, rola na horizontal no celular)
   ============================================================ */
.header{height:var(--header-h);flex-shrink:0;background:var(--bg2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:6px;padding:0 8px;position:relative}
.header h1{font-size:14px;color:var(--accent);white-space:nowrap}
.hscroll{display:flex;gap:6px;align-items:center;overflow-x:auto;flex:1;scrollbar-width:none;min-width:0}
.hscroll::-webkit-scrollbar{display:none}
#aiProvider{max-width:170px}
#modelSelect{max-width:220px}
.spacer{flex:1}
.menu{position:absolute;right:8px;top:calc(var(--header-h) - 2px);background:var(--bg2);border:1px solid var(--border);
  border-radius:8px;padding:6px;display:none;flex-direction:column;gap:4px;z-index:300;min-width:220px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.menu.open{display:flex}
.menu .btn{text-align:left}

/* ============================================================
   LAYOUT
   ============================================================ */
.main{display:flex;flex:1;min-height:0;position:relative}
.panel:not(.open){display:none!important}

/* SIDEBAR */
.sidebar{width:230px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column}
.side-head{padding:8px;border-bottom:1px solid var(--border);display:flex;gap:6px;align-items:center}

.conv-item:hover{background:var(--bg3)}

/* CHAT */
.chat-area{flex:1;display:flex;flex-direction:column;min-width:0}

.conv-title-edit{flex:1;min-width:60px;font-size:13px;font-weight:600;background:transparent;border:1px solid transparent;color:var(--text);border-radius:4px;padding:3px 6px}
.conv-title-edit:hover{border-color:var(--border)}
.conv-title-edit:focus{border-color:var(--accent);outline:none;background:var(--bg3)}

.messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}

.message.user{flex-direction:row-reverse}

.message.user .msg-body{align-items:flex-end}
.bubble{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:9px 13px;font-size:13.5px;line-height:1.6;word-break:break-word;min-width:0;max-width:100%}
.message.user .bubble{background:var(--bg3);border-color:var(--accent)}
.message.error-msg .bubble{border-color:var(--red);color:#ffb3ad}
.message.archived{opacity:.5}
.msg-actions{display:flex;gap:2px;align-items:center;margin-top:3px;font-size:10px;color:var(--text2);flex-wrap:wrap}
.msg-actions button{background:none;border:none;color:var(--text2);cursor:pointer;font-size:13px;padding:2px 5px;border-radius:4px}
.msg-actions button:hover{background:var(--bg3);color:var(--text)}
.summary-box{background:var(--bg2);border:1px dashed var(--orange);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--text2)}
.summary-box summary{cursor:pointer;color:var(--orange)}
.welcome{margin:auto;text-align:center;color:var(--text2);font-size:13px;line-height:1.8;max-width:460px;padding:20px}
.welcome h2{color:var(--accent);font-size:18px;margin-bottom:8px}

/* markdown */
.md-h{font-weight:700;color:#e6edf3;margin:8px 0 2px}
.md-h1{font-size:17px}.md-h2{font-size:15.5px}.md-h3,.md-h4,.md-h5,.md-h6{font-size:14px}
.bubble a{color:var(--accent)}
.bubble hr{border:0;border-top:1px solid var(--border);margin:8px 0}
.inline-code{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:0 4px;font-family:Consolas,Monaco,monospace;font-size:12px;color:#ffa657}

/* CAIXA DE CÓDIGO */
.codebox{border:1px solid var(--border);border-radius:8px;margin:8px 0;overflow:hidden;background:var(--bg)}
.codebox-head{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--bg3);border-bottom:1px solid var(--border);font-size:11px;flex-wrap:wrap}
.cb-lang{color:var(--accent);font-weight:700;text-transform:uppercase}
.cb-lines{color:var(--text2);margin-right:auto}
.cb-btn{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer}

/* INPUT */
.input-area{background:var(--bg2);border-top:1px solid var(--border);padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
.input-options{display:flex;gap:12px;margin-bottom:6px;flex-wrap:wrap;align-items:center}
.input-options label{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:4px;cursor:pointer}
.input-row{display:flex;gap:6px;align-items:flex-end}
.input-box{flex:1;min-width:0;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:8px;
  font-size:14px;resize:none;outline:none;min-height:42px;max-height:200px;line-height:1.5}

.typing-status{font-size:11px;color:var(--text2);margin-top:3px}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}

/* ============================================================
   PAINEL DE CÓDIGO + PRÉVIA AO VIVO
   ============================================================ */
.code-panel{width:46vw;min-width:320px;flex-shrink:0;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column}
.code-panel.wide{width:68vw}
.code-panel-header{padding:6px 8px;border-bottom:1px solid var(--border);display:flex;gap:5px;align-items:center;flex-wrap:wrap}

.code-tab-close{color:var(--red);font-size:13px;opacity:.4;padding:0 2px}
.code-tab:hover .code-tab-close,.code-tab.active .code-tab-close{opacity:1}
.editor-split{flex:1;display:flex;flex-direction:column;min-height:0}
.code-editor{flex:1;min-height:80px;background:var(--bg);color:#e6edf3;border:none;padding:10px;font-family:Consolas,Monaco,'Courier New',monospace;
  font-size:12.5px;resize:none;outline:none;line-height:1.6;tab-size:2;white-space:pre;overflow:auto}
.preview-wrap{flex:1;min-height:120px;border-top:2px solid var(--accent);display:flex;flex-direction:column}
.preview-bar{background:var(--bg2);padding:4px 8px;display:flex;gap:8px;align-items:center;font-size:11px;color:var(--text2);flex-wrap:wrap}
.preview-bar label{display:flex;align-items:center;gap:4px;cursor:pointer}
.preview-wrap iframe{flex:1;border:0;width:100%;background:#fff}
.code-actions{padding:6px 8px;border-top:1px solid var(--border);display:flex;gap:5px;flex-wrap:wrap;align-items:center}

/* ============================================================
   CÉREBRO
   ============================================================ */
.brain-panel{width:320px;flex-shrink:0;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column}
.brain-header{padding:8px 10px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:6px}
.brain-header h3{font-size:13px;color:var(--orange)}
.brain-info{font-size:11px;color:var(--text2);padding:6px 10px;border-bottom:1px solid var(--border);line-height:1.5}
.brain-content{flex:1;overflow-y:auto;padding:8px}
.memory-item{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:12px;line-height:1.5}
.memory-item:hover{border-color:var(--orange)}
.memory-item.pinned{border-color:var(--red)}
.mem-title{font-weight:600;color:#e6edf3;margin:3px 0}
.mem-text{white-space:pre-wrap;max-height:170px;overflow:auto}
.mem-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:10px;color:var(--text2);gap:4px;flex-wrap:wrap}
.mem-btns{display:flex;gap:3px}
.memory-tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;margin:0 3px 3px 0;background:var(--bg);border:1px solid var(--border);color:var(--text2)}
.memory-tag.context{border-color:var(--orange);color:var(--orange)}
.memory-tag.important{border-color:var(--red);color:var(--red)}
.brain-actions{padding:8px;border-top:1px solid var(--border);display:flex;gap:5px;flex-wrap:wrap}

/* ============================================================
   MODAIS
   ============================================================ */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;align-items:center;justify-content:center;padding:10px}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;width:560px;max-width:100%;max-height:92vh;overflow-y:auto}
.modal h2{font-size:16px;margin-bottom:14px;color:var(--accent)}
.form-group{margin-bottom:12px}
.form-group&gt;label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px}
.form-group input:not([type=checkbox]):not([type=range]),.form-group select,.form-group textarea{width:100%}
.form-group textarea{background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;font-size:12.5px;outline:none;resize:vertical;min-height:80px;padding:8px}
.check{display:flex!important;align-items:center;gap:6px;cursor:pointer;color:var(--text)!important}
.range-row{display:flex;align-items:center;gap:8px}
.range-row input[type=range]{flex:1;accent-color:var(--accent)}
.range-val{min-width:50px;text-align:right;font-size:12px;color:var(--accent)}
.api-row{display:flex;gap:6px}
.api-row input{flex:1;min-width:0}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.section-title{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.hint{font-size:11px;color:var(--text2);line-height:1.5;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* TOAST */
.toast{position:fixed;bottom:18px;right:18px;left:auto;max-width:min(460px,calc(100vw - 36px));background:var(--bg3);border:1px solid var(--border);color:var(--text);
  padding:9px 14px;border-radius:8px;font-size:12.5px;z-index:9999;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{border-color:var(--green);color:var(--green)}
.toast.error{border-color:var(--red);color:#ffb3ad}
.toast.warn{border-color:var(--yellow);color:var(--yellow)}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ============================================================
   CELULAR / TABLET — painéis viram telas sobrepostas
   ============================================================ */
@media (max-width:820px){
  .header h1 .full{display:none}
  .sidebar,.code-panel,.brain-panel{position:absolute;top:0;bottom:0;z-index:60;width:100%!important;min-width:0}
  .sidebar{left:0}.code-panel,.brain-panel{right:0}
  .msg-body{max-width:92%}
  .messages{padding:10px}
  .avatar{width:26px;height:26px;font-size:12px}
  .context-bar{display:none}
  .grid2{grid-template-columns:1fr}
  .btn{min-height:36px}
  .btn.sm{min-height:28px}
}

async function copyText(t) {

const DEFAULT_SYS = `Você é um assistente especialista em programação e tecnologia. Responda em português do Brasil.

/* ============================================================

const PROVIDERS = {

  deepseek:   { name: 'DeepSeek',           type: 'openai', base: 'https://api.deepseek.com/v1', models: ['deepseek-chat', 'deepseek-reasoner'], hint: 'sk-...' },

  xai:        { name: 'xAI Grok',           type: 'openai', base: 'https://api.x.ai/v1', models: ['grok-4', 'grok-3-mini'], hint: 'xai-...' },

  conversations: {}, activeConvId: null,
  codeTabs: [], activeCodeTab: 0,
  memories: [],
  settings: {
    keys: {}, serperKey: '', ollamaUrl: 'http://localhost:11434', customBase: '',
    provider: 'gemini', model: 'gemini-2.5-flash', lastModel: {}, modelCache: {}, customModels: {}, geminiAuthMode: '',

};

/* ============================================================
   ARMAZENAMENTO
   ============================================================ */
const MODULE_Storage = (() =&gt; {
  const KEY = 'aiStudio_v2';
  let timer = null;
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        conversations: STATE.conversations, activeConvId: STATE.activeConvId,
        codeTabs: STATE.codeTabs, activeCodeTab: STATE.activeCodeTab,
        memories: STATE.memories, settings: STATE.settings, _version: STATE._version
      }));
    } catch (e) { MODULE_UI.toast('⚠️ Armazenamento do navegador cheio — exporte um backup e apague conversas antigas.', 'warn'); }
  }
  function saveSoon() { clearTimeout(timer); timer = setTimeout(save, 400); }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      STATE.conversations = d.conversations || {};
      Object.values(STATE.conversations).forEach(c =&gt; { c.messages = c.messages || []; c.updatedAt = c.updatedAt || c.createdAt || Date.now(); });
      STATE.activeConvId = d.activeConvId || null;
      STATE.codeTabs = (d.codeTabs || []).map(t =&gt; ({ language: 'text', content: '', ...t }));
      STATE.activeCodeTab = d.activeCodeTab || 0;
      STATE.memories = (d.memories || []).map(normMemory);
      const o = d.settings || {};
      STATE.settings = { ...STATE.settings, ...o, keys: { ...(o.keys || {}) } };
      // migração da versão antiga
      if (o.apiKey &amp;&amp; !S().keys.openai) S().keys.openai = o.apiKey;
      if (o.geminiKey &amp;&amp; !S().keys.gemini) S().keys.gemini = o.geminiKey;
      if (o.anthropicKey &amp;&amp; !S().keys.anthropic) S().keys.anthropic = o.anthropicKey;
      ['apiKey', 'geminiKey', 'anthropicKey', 'contextStrategy', 'autoSaveInterval', 'autoMemory'].forEach(k =&gt; delete S()[k]);
      if (!S().systemPrompt || S().systemPrompt.startsWith('Você é um assistente especialista em programação. Ao gerar')) S().systemPrompt = DEFAULT_SYS;
      if (!PROVIDERS[S().provider]) S().provider = 'gemini';
    } catch (e) { console.error(e); }
  }
  function normMemory(m) {
    return { id: m.id || uid('mem'), content: m.content || '', title: m.title || '', tags: m.tags || (m.type ? [m.type] : []),
             pinned: !!m.pinned, scope: m.scope || 'global', createdAt: m.createdAt || Date.now() };
  }
  const stamp = () =&gt; new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
  function download(content, filename, type) {
    const blob = new Blob([content], { type });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() =&gt; URL.revokeObjectURL(a.href), 5000);
  }
  function exportAll() {
    MODULE_Code.sync();
    const withKeys = confirm('Incluir as chaves de API no backup?\n\nOK = incluir\nCancelar = sem chaves (mais seguro)');
    const settings = JSON.parse(JSON.stringify(S()));
    if (!withKeys) { settings.keys = {}; settings.serperKey = ''; }
    download(JSON.stringify({ app: 'ai-code-studio', _version: STATE._version, exportedAt: new Date().toISOString(),
      conversations: STATE.conversations, codeTabs: STATE.codeTabs, memories: STATE.memories, settings }, null, 2),
      `ai-studio-backup-${stamp()}.json`, 'application/json');
  }
  function importBackup() { $('fileImportBackup').click(); }
  function handleImport(e) {
    const file = e.target.files[0]; e.target.value = '';
    if (!file) return;
    const r = new FileReader();
    r.onload = ev =&gt; {
      try {
        const d = JSON.parse(ev.target.result);
        if (d.conversations) Object.assign(STATE.conversations, d.conversations);
        if (Array.isArray(d.memories)) MODULE_Brain.mergeMemories(d.memories);
        if (Array.isArray(d.codeTabs) &amp;&amp; d.codeTabs.length &amp;&amp; confirm(`Importar também ${d.codeTabs.length} aba(s) de código?`))
          STATE.codeTabs.push(...d.codeTabs.map(t =&gt; ({ ...t, id: uid('tab') })));
        if (d.settings &amp;&amp; confirm('Importar também as configurações?')) {
          const keys = { ...S().keys };
          Object.entries(d.settings.keys || {}).forEach(([k, v]) =&gt; { if (v) keys[k] = v; });
          STATE.settings = { ...S(), ...d.settings, keys };
        }
        save(); refreshAll();
        MODULE_UI.toast('✅ Backup importado!', 'success');
      } catch (err) { MODULE_UI.toast('❌ Arquivo de backup inválido', 'error'); }
    };
    r.readAsText(file);
  }
  return { save, saveSoon, load, exportAll, importBackup, handleImport, download, stamp, normMemory };
})();
