const MODULE_Provider = (() =&gt; {
  function models(p) {
    const cache = S().modelCache?.[p];
    const base = cache &amp;&amp; cache.length ? cache : PROVIDERS[p].models;
    return [...new Set([...(S().customModels?.[p] || []), ...base])];
  }
  function fillProviders() {
    $('aiProvider').innerHTML = Object.entries(PROVIDERS).map(([k, p]) =&gt; `&lt;option value=&quot;${k}&quot;&gt;${p.name}&lt;/option&gt;`).join('');
    $('aiProvider').value = S().provider;
  }
  function fillModels() {
    const p = $('aiProvider').value;
    const list = models(p);
    const cur = S().lastModel?.[p] || (p === S().provider ? S().model : '') || list[0] || '';
    if (cur &amp;&amp; !list.includes(cur)) list.unshift(cur);
    $('modelSelect').innerHTML = list.map(m =&gt; `&lt;option value=&quot;${escapeHtml(m)}&quot;&gt;${escapeHtml(m)}&lt;/option&gt;`).join('') +
      '&lt;option value=&quot;__custom&quot;&gt;✏️ Digitar outro modelo…&lt;/option&gt;';
    if (cur) $('modelSelect').value = cur;
    S().model = $('modelSelect').value === '__custom' ? '' : $('modelSelect').value;
  }
  function onProviderChange() { S().provider = $('aiProvider').value; fillModels(); MODULE_Storage.saveSoon(); }
  function onModelChange() {
    const p = $('aiProvider').value;
    let m = $('modelSelect').value;
    if (m === '__custom') {
      m = (prompt('Nome exato do modelo (como aparece na documentação do provedor):') || '').trim();
      if (!m) { fillModels(); return; }
      S().customModels = { ...(S().customModels || {}), [p]: [m, ...((S().customModels || {})[p] || [])] };
    }
    S().model = m; S().lastModel = { ...(S().lastModel || {}), [p]: m };
    fillModels(); MODULE_Storage.saveSoon();
  }
  function current() { return { provider: $('aiProvider').value, model: $('modelSelect').value === '__custom' ? '' : $('modelSelect').value }; }
  async function refreshModels() {
    const p = current().provider;
    MODULE_UI.toast(`🔄 Buscando modelos de ${PROVIDERS[p].name}...`);
    try {
      const list = await MODULE_AI.listModels(p);
      if (!list.length) throw new Error('a API não retornou modelos');
      S().modelCache = { ...(S().modelCache || {}), [p]: [...new Set(list)].sort() };
      fillModels(); MODULE_Storage.save();
      MODULE_UI.toast(`✅ ${list.length} modelos carregados — escolha na lista`, 'success');
    } catch (e) { MODULE_UI.toast('❌ ' + e.message, 'error'); }
  }
  function init() { fillProviders(); fillModels(); }
  return { init, fillModels, onProviderChange, onModelChange, current, refreshModels };
})();

/* ============================================================
   CHAMADAS DE IA
   ============================================================ */
const MODULE_AI = (() =&gt; {
  const key = p =&gt; String(S().keys[p] || '').replace(/\s+/g, '');
  function baseUrl(p) {
    if (p === 'ollama') return (S().ollamaUrl || 'http://localhost:11434').replace(/\/+$/, '') + '/v1';
    if (p === 'custom') return (S().customBase || '').replace(/\/+$/, '');
    return PROVIDERS[p].base;
  }
  async function httpErr(res, label) {
    let t = '';
    try { const j = await res.json(); t = j.error?.message || j.message || j.error || JSON.stringify(j).slice(0, 300); }
    catch (e) { try { t = (await res.text()).slice(0, 300); } catch (e2) {} }
    if (typeof t !== 'string') t = JSON.stringify(t);
    return new Error(`${label} HTTP ${res.status}: ${t || res.statusText}`);
  }
  // junta mensagens seguidas do mesmo papel e garante que começa pelo usuário
  function mergeRoles(msgs) {
    const out = [];
    msgs.forEach(m =&gt; {
      const last = out[out.length - 1];
      if (last &amp;&amp; last.role === m.role) last.content += '\n\n' + m.content;
      else out.push({ role: m.role, content: m.content });
    });
    if (out.length &amp;&amp; out[0].role !== 'user') out.unshift({ role: 'user', content: '(continuação da conversa)' });
    return out;
  }

  /* ---------- GEMINI: tenta header x-goog-api-key, ?key= e Bearer ---------- */
  async function geminiFetch(url, init = {}) {
    const k = key('gemini');
    if (!k) throw new Error('Coloque a chave do Gemini em ⚙️ Configurações.');
    const modes = ['header', 'query', 'bearer'];
    const pref = S().geminiAuthMode;
    if (pref &amp;&amp; modes.includes(pref)) { modes.splice(modes.indexOf(pref), 1); modes.unshift(pref); }
    let lastErr;
    for (const mode of modes) {
      const headers = { ...(init.headers || {}) };
      let u = url;
      if (mode === 'header') headers['x-goog-api-key'] = k;
      else if (mode === 'query') u += (u.includes('?') ? '&amp;' : '?') + 'key=' + encodeURIComponent(k);
      else headers['Authorization'] = 'Bearer ' + k;
      let res;
      try { res = await fetch(u, { ...init, headers }); }
      catch (e) { if (e.name === 'AbortError') throw e; lastErr = e; continue; }
      if (res.ok) {
        if (S().geminiAuthMode !== mode) { S().geminiAuthMode = mode; MODULE_Storage.saveSoon(); }
        return res;
      }
      const err = await httpErr(res, 'Gemini');
      lastErr = err;
      const authish = res.status === 401 || res.status === 403 || /api[ _-]?key|auth|credential|permission|unauthenticated/i.test(err.message);
      if (!authish) throw err;
    }
    throw new Error((lastErr?.message || 'Falha de conexão') + ' — confira a chave do Gemini (testei os 3 formatos de autenticação).');
  }
  async function _gemini(model, system, msgs, o) {
    const body = {
      contents: mergeRoles(msgs).map(m =&gt; ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })),
      generationConfig: { temperature: o.temperature, maxOutputTokens: o.maxTokens }
    };
    if (system) body.systemInstruction = { parts: [{ text: system }] };
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
    const res = await geminiFetch(url, { method: 'POST', signal: o.signal, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await res.json();
    const c = data.candidates?.[0];
    if (!c) throw new Error('Gemini não respondeu' + (data.promptFeedback?.blockReason ? ` (bloqueado: ${data.promptFeedback.blockReason})` : ''));
    const txt = (c.content?.parts || []).filter(p =&gt; p.text &amp;&amp; !p.thought).map(p =&gt; p.text).join('');
    if (!txt) throw new Error(`Resposta vazia do Gemini (motivo: ${c.finishReason || '?'}). Se for MAX_TOKENS, aumente 📏.`);
    if (c.finishReason === 'MAX_TOKENS') MODULE_UI.toast('⚠️ Resposta cortada pelo limite 📏 — aumente o valor ou peça &quot;continue&quot;.', 'warn');
    return txt;
  }

  /* ---------- ANTHROPIC ---------- */
  function anthHeaders() {
    const k = key('anthropic');
    if (!k) throw new Error('Coloque a chave da Anthropic em ⚙️ Configurações.');
    return { 'Content-Type': 'application/json', 'x-api-key': k, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
  }
  async function _anthropic(model, system, msgs, o) {
    const body = { model, max_tokens: o.maxTokens, temperature: Math.min(1, o.temperature), messages: mergeRoles(msgs) };
    if (system) body.system = system;
    const res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', signal: o.signal, headers: anthHeaders(), body: JSON.stringify(body) });
    if (!res.ok) throw await httpErr(res, 'Anthropic');
    const d = await res.json();
    if (d.stop_reason === 'max_tokens') MODULE_UI.toast('⚠️ Resposta cortada pelo limite 📏.', 'warn');
    return (d.content || []).filter(b =&gt; b.type === 'text').map(b =&gt; b.text).join('');
  }

  /* ---------- OPENAI E COMPATÍVEIS (Groq, OpenRouter, DeepSeek, Mistral, xAI, Ollama, personalizado) ---------- */
  function oaHeaders(p) {
    const h = { 'Content-Type': 'application/json' };
    const k = key(p);
    if (k) h['Authorization'] = 'Bearer ' + k;
    if (p === 'openrouter') h['X-Title'] = 'AI Code Studio';
    return h;
  }
  async function _openaiCompat(p, model, system, msgs, o) {
    const base = baseUrl(p);
    if (!base) throw new Error('Configure a URL base do provedor Personalizado em ⚙️.');
    if (!key(p) &amp;&amp; p !== 'ollama' &amp;&amp; p !== 'custom') throw new Error(`Coloque a chave de ${PROVIDERS[p].name} em ⚙️ Configurações.`);
    const messages = [...(system ? [{ role: 'system', content: system }] : []), ...msgs.map(m =&gt; ({ role: m.role, content: m.content }))];
    const body = { model, messages };
    if (p === 'openai') {
      body.max_completion_tokens = o.maxTokens;
      if (!/^(o\d|gpt-5)/i.test(model)) body.temperature = o.temperature; // modelos de raciocínio não aceitam temperature
    } else { body.max_tokens = o.maxTokens; body.temperature = o.temperature; }
    let res;
    try { res = await fetch(base + '/chat/completions', { method: 'POST', signal: o.signal, headers: oaHeaders(p), body: JSON.stringify(body) }); }
    catch (e) {
      if (e.name === 'AbortError') throw e;
      if (p === 'ollama') throw new Error('Não conectei no Ollama. Inicie com a variável OLLAMA_ORIGINS=&quot;*&quot; e confira a URL em ⚙️.');
      throw new Error('Falha de rede/CORS ao chamar ' + PROVIDERS[p].name + ': ' + e.message);
    }
    if (!res.ok) throw await httpErr(res, PROVIDERS[p].name);
    const d = await res.json();
    const msg = d.choices?.[0]?.message;
    let txt = msg?.content;
    if (Array.isArray(txt)) txt = txt.map(x =&gt; x.text || '').join('');
    if (!txt) throw new Error('Resposta vazia de ' + PROVIDERS[p].name + (d.choices?.[0]?.finish_reason ? ` (${d.choices[0].finish_reason})` : ''));
    return txt;
  }

  async function call(provider, model, system, messages, o = {}) {
    if (!model) throw new Error('Escolha um modelo no topo.');
    const opts = { temperature: o.temperature ?? S().temperature, maxTokens: o.maxTokens ?? S().maxTokens, signal: o.signal };
    const type = PROVIDERS[provider].type;
    if (type === 'gemini') return _gemini(model, system, messages, opts);
    if (type === 'anthropic') return _anthropic(model, system, messages, opts);
    return _openaiCompat(provider, model, system, messages, opts);
  }

  async function listModels(p) {
    const type = PROVIDERS[p].type;
    if (type === 'gemini') {
      const res = await geminiFetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000', { method: 'GET' });
      const d = await res.json();
      return (d.models || []).filter(m =&gt; (m.supportedGenerationMethods || []).includes('generateContent')).map(m =&gt; m.name.replace(/^models\//, ''));
    }
    if (type === 'anthropic') {
      const res = await fetch('https://api.anthropic.com/v1/models?limit=100', { headers: anthHeaders() });
      if (!res.ok) throw await httpErr(res, 'Anthropic');
      return ((await res.json()).data || []).map(m =&gt; m.id);
    }
    if (p === 'ollama') {
      const res = await fetch((S().ollamaUrl || 'http://localhost:11434').replace(/\/+$/, '') + '/api/tags');
      if (!res.ok) throw await httpErr(res, 'Ollama');
      return ((await res.json()).models || []).map(m =&gt; m.name);
    }
    const base = baseUrl(p);
    if (!base) throw new Error('Configure a URL base em ⚙️.');
    const res = await fetch(base + '/models', { headers: oaHeaders(p) });
    if (!res.ok) throw await httpErr(res, PROVIDERS[p].name);
    const d = await res.json();
    return (d.data || d.models || []).map(m =&gt; m.id || m.name).filter(Boolean);
  }

  async function webSearch(q) {
    const k = String(S().serperKey || '').trim();
    if (!k) throw new Error('Configure a chave Serper em ⚙️ para usar 🌐 Web');
    const res = await fetch('https://google.serper.dev/search', {
      method: 'POST', headers: { 'X-API-KEY': k, 'Content-Type': 'application/json' },
      body: JSON.stringify({ q: q.slice(0, 300), gl: 'br', hl: 'pt-br', num: 6 })
    });
    if (!res.ok) throw await httpErr(res, 'Serper');
    const d = await res.json();
    return (d.organic || []).slice(0, 6).map((x, i) =&gt; `[${i + 1}] ${x.title}\n${x.snippet || ''}\n${x.link}`).join('\n\n');
  }

  return { call, listModels, webSearch };
})();

/* ============================================================
   CONTEXTO (a IA não &quot;caducar&quot;)
   ============================================================ */
const MODULE_Context = (() =&gt; {
  const sendable = conv =&gt; conv.messages.filter(m =&gt; (m.role === 'user' || m.role === 'assistant') &amp;&amp; !m.archived);

  function build(conv, query, webBlock) {
    let system = S().systemPrompt || '';
    const mem = MODULE_Brain.getContextBlock(conv, query);
    if (mem) system += '\n\n### MEMÓRIA DE LONGO PRAZO (considere sempre)\n' + mem;
    if (conv.summary) system += '\n\n### RESUMO DA CONVERSA ATÉ AQUI (mensagens antigas)\n' + conv.summary;
    let hist = sendable(conv).map(m =&gt; ({ role: m.role, content: m.content }));
    if (webBlock &amp;&amp; hist.length) {
      const last = hist[hist.length - 1];
      hist[hist.length - 1] = { ...last, content: last.content + '\n\n[Resultados de pesquisa na web — cite as fontes]\n' + webBlock };
    }
    const budget = Math.max(1000, (+S().contextLimit || 32000) - est(system));
    let dropped = 0;
    while (hist.length &gt; 1 &amp;&amp; est(hist.map(m =&gt; m.content).join('')) &gt; budget) { hist.shift(); dropped++; }
    while (hist.length &gt; 1 &amp;&amp; hist[0].role !== 'user') { hist.shift(); dropped++; }
    if (dropped) MODULE_UI.toast(`⚠️ ${dropped} mensagem(ns) antiga(s) ficaram fora do limite. Use 📋 para resumir ou aumente o limite em ⚙️.`, 'warn');
    return { system, history: hist };
  }

  function updateBar() {
    const conv = activeConv();
    const tokens = conv ? est(sendable(conv).map(m =&gt; m.content).join('') + (conv.summary || '')) : 0;
    const lim = +S().contextLimit || 32000;
    const pct = Math.min(100, tokens / lim * 100);
    $('tokenCount').textContent = tokens &gt;= 1000 ? (tokens / 1000).toFixed(1) + 'k' : tokens;
    $('contextFill').style.width = pct + '%';
    $('contextFill').style.background = pct &gt; 85 ? 'var(--red)' : pct &gt; 60 ? 'var(--yellow)' : 'var(--green)';
  }

  async function compact(conv, signal) {
    const keep = Math.max(2, +S().keepRecent || 10);
    const active = sendable(conv);
    if (active.length &lt;= keep) return false;
    const old = active.slice(0, active.length - keep);
    let transcript = old.map(m =&gt; (m.role === 'user' ? 'USUÁRIO' : 'IA') + ': ' + m.content).join('\n\n');
    if (transcript.length &gt; 120000) transcript = transcript.slice(-120000);
    const { provider, model } = MODULE_Provider.current();
    MODULE_UI.setTypingStatus('📋 Resumindo mensagens antigas para não perder o fio...');
    const summary = await MODULE_AI.call(provider, model,
      'Você resume conversas técnicas com precisão, em português, sem inventar nada.',
      [{ role: 'user', content:
`Atualize o RESUMO incorporando as NOVAS MENSAGENS. Preserve com precisão: objetivo do projeto, decisões tomadas, nomes de arquivos/funções/variáveis, tecnologias, estado atual do código (o que funciona e o que falta), erros já resolvidos, preferências do usuário e pendências. Use tópicos curtos. Não inclua código longo, só o essencial.

RESUMO ANTERIOR:
${conv.summary || '(nenhum)'}

NOVAS MENSAGENS:
${transcript}` }],
      { temperature: 0.2, maxTokens: 3000, signal });
    conv.summary = summary.trim();
    old.forEach(m =&gt; { m.archived = true; });
    MODULE_Storage.save();
    return true;
  }

  async function autoCompact(conv, signal) {
    if (!S().autoSummarize) return;
    const tokens = est(sendable(conv).map(m =&gt; m.content).join(''));
    if (tokens &lt; (+S().contextLimit || 32000) * 0.75) return;
    await compact(conv, signal);
  }

  async function compactNow() {
    const conv = activeConv();
    if (!conv || STATE.isLoading) return;
    MODULE_Chat.setLoading(true);
    try {
      const ok = await compact(conv);
      MODULE_UI.toast(ok ? '📋 Mensagens antigas resumidas — a IA continua sabendo de tudo.' : `Poucas mensagens ainda (mantenho as últimas ${S().keepRecent} inteiras).`, ok ? 'success' : '');
    } catch (e) { MODULE_UI.toast('❌ ' + e.message, 'error'); }
    MODULE_Chat.setLoading(false);
    MODULE_Chat.renderMessages();
  }

  function clear() {
    const conv = activeConv();
    if (!conv || !conv.messages.length) return;
    if (!confirm('Apagar todas as mensagens desta conversa? (Dica: 🧠 antes, para guardar no cérebro)')) return;
    conv.messages = []; conv.summary = '';
    MODULE_Storage.save(); MODULE_Chat.renderMessages();
  }
  return { build, updateBar, autoCompact, compactNow, clear };
})();

const MODULE_Brain = (() =&gt; {

    $('brainPanel').classList.toggle('open');

  function render() {

      .filter(m =&gt; !q || (m.content + ' ' + m.title + ' ' + m.tags.join(' ')).toLowerCase().includes(q))

    }
    $('brainContent').innerHTML = list.map(m =&gt; {

      return `&lt;div class=&quot;memory-item ${m.pinned ? 'pinned' : ''}&quot;&gt;
        &lt;div&gt;${m.pinned ? '&lt;span class=&quot;memory-tag important&quot;&gt;📌 fixa&lt;/span&gt;' : ''}&lt;span class=&quot;memory-tag&quot;&gt;${scope}&lt;/span&gt;${m.tags.map(t =&gt; `&lt;span class=&quot;memory-tag context&quot;&gt;${escapeHtml(t)}&lt;/span&gt;`).join('')}&lt;/div&gt;
        ${m.title ? `&lt;div class=&quot;mem-title&quot;&gt;${escapeHtml(m.title)}&lt;/div&gt;` : ''}
        &lt;div class=&quot;mem-text&quot;&gt;${escapeHtml(m.content)}&lt;/div&gt;
        &lt;div class=&quot;mem-foot&quot;&gt;&lt;span&gt;${new Date(m.createdAt).toLocaleString('pt-BR')}&lt;/span&gt;
          &lt;span class=&quot;mem-btns&quot;&gt;
            &lt;button class=&quot;btn sm ${m.pinned ? 'on' : ''}&quot; onclick=&quot;MODULE_Brain.togglePin('${m.id}')&quot; title=&quot;Fixar: sempre enviada à IA&quot;&gt;📌&lt;/button&gt;
            &lt;button class=&quot;btn sm&quot; onclick=&quot;MODULE_Brain.edit('${m.id}')&quot; title=&quot;Editar&quot;&gt;✏️&lt;/button&gt;
            &lt;button class=&quot;btn sm&quot; onclick=&quot;copyText(MODULE_Brain.get('${m.id}').content)&quot; title=&quot;Copiar&quot;&gt;📋&lt;/button&gt;
            &lt;button class=&quot;btn sm&quot; onclick=&quot;MODULE_Brain.deleteMemory('${m.id}')&quot; title=&quot;Apagar&quot; style=&quot;color:var(--red)&quot;&gt;✕&lt;/button&gt;
          &lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`;
    }).join('');
  }
  function add(o) {
    const m = MODULE_Storage.normMemory({ id: uid('mem'), createdAt: Date.now(), ...o });
    STATE.memories.unshift(m);
    MODULE_Storage.save(); render();
    return m;
  }
  function openModal() { $('memoryModal').classList.add('open'); setTimeout(() =&gt; $('memoryContent').focus(), 50); }
  function addManual() {
    editingId = null;
    $('memoryModalTitle').textContent = '🧠 Adicionar Memória';
    $('memoryContent').value = ''; $('memoryTags').value = ''; $('memoryPinned').checked = false; $('memoryScope').value = 'global';
    openModal();
  }
  function edit(id) {
    const m = get(id); if (!m) return;
    editingId = id;
    $('memoryModalTitle').textContent = '✏️ Editar Memória';
    $('memoryContent').value = m.content; $('memoryTags').value = m.tags.join(', ');
    $('memoryPinned').checked = m.pinned; $('memoryScope').value = m.scope === 'global' ? 'global' : 'conv';
    openModal();
  }
  function closeMemoryModal() { $('memoryModal').classList.remove('open'); }
  function saveManual() {
    const content = $('memoryContent').value.trim();
    if (!content) return;
    const tags = $('memoryTags').value.split(',').map(s =&gt; s.trim()).filter(Boolean);
    const conv = activeConv();
    const scope = $('memoryScope').value === 'conv' &amp;&amp; conv ? conv.id : 'global';
    const pinned = $('memoryPinned').checked;
    if (editingId &amp;&amp; get(editingId)) Object.assign(get(editingId), { content, tags, scope, pinned });
    else add({ content, tags, scope, pinned });
    MODULE_Storage.save(); closeMemoryModal(); render();
    MODULE_UI.toast('🧠 Memória salva!', 'success');
  }
  function togglePin(id) { const m = get(id); if (m) { m.pinned = !m.pinned; MODULE_Storage.save(); render(); } }
  function deleteMemory(id) { if (!confirm('Apagar esta memória?')) return; STATE.memories = STATE.memories.filter(m =&gt; m.id !== id); MODULE_Storage.save(); render(); }
  function clearAll() {
    if (!STATE.memories.length) return;
    if (!confirm(`Apagar TODAS as ${STATE.memories.length} memórias? Faça um 💾 Backup antes.`)) return;
    STATE.memories = []; MODULE_Storage.save(); render();
  }
  async function memorizeConversation(conv) {
    conv = conv || activeConv();
    const msgs = (conv?.messages || []).filter(m =&gt; m.role === 'user' || m.role === 'assistant');
    if (!msgs.length) { MODULE_UI.toast('Conversa vazia'); return false; }
    let transcript = msgs.map(m =&gt; (m.role === 'user' ? 'USUÁRIO' : 'IA') + ': ' + m.content).join('\n\n');
    if (transcript.length &gt; 100000) transcript = transcript.slice(-100000);
    const { provider, model } = MODULE_Provider.current();
    MODULE_UI.toast('🧠 A IA está criando a memória desta conversa...');
    try {
      const content = await MODULE_AI.call(provider, model,
        'Você cria memórias de longo prazo objetivas, em português, sem inventar nada.',
        [{ role: 'user', content:
`Crie uma MEMÓRIA DE LONGO PRAZO desta conversa, em tópicos curtos, com: objetivo/projeto, decisões tomadas, tecnologias, arquivos e funções importantes, estado atual (o que funciona / o que falta), preferências do usuário e pendências. Máximo ~250 palavras.

${conv.summary ? 'RESUMO ANTERIOR:\n' + conv.summary + '\n\n' : ''}CONVERSA:
${transcript}` }],
        { temperature: 0.2, maxTokens: 2000 });
      add({ content: content.trim(), title: conv.title, tags: ['conversa'] });
      MODULE_UI.toast('🧠 Memória criada no cérebro!', 'success');
      return true;
    } catch (e) { MODULE_UI.toast('❌ Não consegui criar a memória: ' + e.message, 'error'); return false; }
  }
  function memorizeMessage(i) {
    const conv = activeConv(); const m = conv?.messages[i]; if (!m) return;
    add({ content: m.content.slice(0, 8000), title: conv.title, tags: [m.role === 'user' ? 'pedido' : 'resposta'] });
    MODULE_UI.toast('🧠 Mensagem guardada no cérebro', 'success');
  }
  function getContextBlock(conv, query) {
    const pool = STATE.memories.filter(m =&gt; m.scope === 'global' || m.scope === conv.id);
    const pinned = pool.filter(m =&gt; m.pinned);
    const words = new Set((String(query || '').toLowerCase().match(/[a-zà-ÿ0-9_]{4,}/g) || []));
    const n = Math.max(0, +S().memoryInjectCount || 0);
    const rest = pool.filter(m =&gt; !m.pinned).map(m =&gt; {
      const t = (m.content + ' ' + m.title + ' ' + m.tags.join(' ')).toLowerCase();
      let sc = 0; words.forEach(w =&gt; { if (t.includes(w)) sc++; });
      if (m.scope === conv.id) sc += 2;
      return { m, sc };
    }).sort((a, b) =&gt; b.sc - a.sc || b.m.createdAt - a.m.createdAt).slice(0, n).map(x =&gt; x.m);
    const all = [...pinned, ...rest];
    if (!all.length) return '';
    return all.map(m =&gt; `- ${m.pinned ? '[FIXA] ' : ''}${m.title ? '(' + m.title + ') ' : ''}${m.content}`).join('\n');
  }
  function mergeMemories(list) {
    const ids = new Set(STATE.memories.map(m =&gt; m.id));
    list.forEach(m =&gt; { if (m &amp;&amp; m.content &amp;&amp; !ids.has(m.id)) STATE.memories.push(MODULE_Storage.normMemory(m)); });
  }
  function exportMemory() {
    MODULE_Storage.download(JSON.stringify({ app: 'ai-code-studio-memory', memories: STATE.memories }, null, 2), `cerebro-${MODULE_Storage.stamp()}.json`, 'application/json');
  }
  function importMemory() { $('fileImportMemory').click(); }
  function handleImport(e) {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    const r = new FileReader();
    r.onload = ev =&gt; {
      try {
        const d = JSON.parse(ev.target.result);
        const list = Array.isArray(d) ? d : (d.memories || []);
        const before = STATE.memories.length;
        mergeMemories(list); MODULE_Storage.save(); render();
        MODULE_UI.toast(`🧠 ${STATE.memories.length - before} memória(s) restaurada(s)`, 'success');
      } catch (err) { MODULE_UI.toast('❌ Arquivo inválido', 'error'); }
    };
    r.readAsText(f);
  }
  return { toggle, render, get, add, addManual, edit, closeMemoryModal, saveManual, togglePin, deleteMemory, clearAll,
           memorizeConversation, memorizeMessage, getContextBlock, mergeMemories, exportMemory, importMemory, handleImport };
})();

/* ============================================================
   RENDERIZAÇÃO DE MENSAGENS (markdown + caixas de código)

let CODE_REG = {}, codeSeq = 0;
function codeBox(b) {
  const id = 'cb' + (++codeSeq);
  CODE_REG[id] = b;
  const lines = b.code.split('\n').length;
  const isHtml = /^(html|htm|svg|xml|vue)$/.test(b.lang) || (!b.lang &amp;&amp; /^\s*&lt;(!doctype|html)/i.test(b.code));
  return `&lt;div class=&quot;codebox&quot;&gt;&lt;div class=&quot;codebox-head&quot;&gt;&lt;span class=&quot;cb-lang&quot;&gt;${escapeHtml(b.lang || 'código')}&lt;/span&gt;&lt;span class=&quot;cb-lines&quot;&gt;${lines} linha${lines &gt; 1 ? 's' : ''}&lt;/span&gt;` +
    `&lt;button class=&quot;cb-btn&quot; onclick=&quot;MODULE_Code.copyBlock('${id}',this)&quot;&gt;📋 Copiar&lt;/button&gt;` +
    `&lt;button class=&quot;cb-btn&quot; onclick=&quot;MODULE_Code.blockToEditor('${id}')&quot;&gt;↗ Editor&lt;/button&gt;` +
    (isHtml ? `&lt;button class=&quot;cb-btn&quot; onclick=&quot;MODULE_Code.previewBlock('${id}')&quot;&gt;▶ Ver&lt;/button&gt;` : '') +
    `&lt;/div&gt;&lt;pre&gt;&lt;code&gt;${escapeHtml(b.code)}&lt;/code&gt;&lt;/pre&gt;&lt;/div&gt;`;
}
function formatMessage(text) {
  text = String(text ?? '');
  const blocks = [], inl = [];
  text = text.replace(/```([^\n`]*)\n?([\s\S]*?)(?:```|$)/g, (_, info, code) =&gt; {
    blocks.push({ lang: (info.trim().split(/\s+/)[0] || '').toLowerCase(), code: code.replace(/\n$/, '') });
    return '\u0000B' + (blocks.length - 1) + '\u0000';
  });
  text = text.replace(/`([^`\n]+)`/g, (_, c) =&gt; { inl.push(c); return '\u0001I' + (inl.length - 1) + '\u0001'; });
  text = escapeHtml(text);
  text = text.replace(/^(#{1,6})\s+(.+)$/gm, (_, h, t) =&gt; `&lt;div class=&quot;md-h md-h${h.length}&quot;&gt;${t}&lt;/div&gt;`);
  text = text.replace(/^\s*(?:---|\*\*\*)\s*$/gm, '&lt;hr&gt;');
  text = text.replace(/^(\s*)[-*•]\s+/gm, '$1• ');
  text = text.replace(/\*\*([^*\n]+)\*\*/g, '&lt;strong&gt;$1&lt;/strong&gt;');
  text = text.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/gm, '$1&lt;em&gt;$2&lt;/em&gt;');
  text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '&lt;a href=&quot;$2&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;$1&lt;/a&gt;');
  text = text.replace(/(^|[\s(])(https?:\/\/[^\s&lt;)]+)/g, '$1&lt;a href=&quot;$2&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;$2&lt;/a&gt;');
  text = text.replace(/\n?\u0000B(\d+)\u0000\n?/g, '\u0000B$1\u0000');
  text = text.replace(/(&lt;\/div&gt;|&lt;hr&gt;)\n/g, '$1');
  text = text.replace(/\n/g, '&lt;br&gt;');
  text = text.replace(/\u0001I(\d+)\u0001/g, (_, n) =&gt; `&lt;code class=&quot;inline-code&quot;&gt;${escapeHtml(inl[n])}&lt;/code&gt;`);
  text = text.replace(/\u0000B(\d+)\u0000/g, (_, n) =&gt; codeBox(blocks[n]));
  return text;
}

    const b = CODE_REG[id]; if (!b) return;
    newTab(null, b.code, b.lang ? normLang(b.lang) : guessLang(b.code));
    open(); MODULE_UI.toast('↗ Aberto no editor', 'success');
  }
  function previewBlock(id) { blockToEditor(id); if (!previewOn) togglePreview(); else refreshPreview(); }
  function togglePreview() {
    previewOn = !previewOn;
    $('previewWrap').classList.toggle('hidden', !previewOn);
    $('previewBtn').classList.toggle('on', previewOn);
    if (previewOn) refreshPreview();
  }
  const afterTag = (h, re, ins) =&gt; { const m = h.match(re); return m ? h.slice(0, m.index + m[0].length) + ins + h.slice(m.index + m[0].length) : ins + h; };
  const beforeTag = (h, re, ins) =&gt; { const m = h.match(re); return m ? h.slice(0, m.index) + ins + h.slice(m.index) : h + ins; };
  function buildDoc() {
    sync(); const t = tab(); if (!t) return '';
    let html = '', css = '', js = '';
    if ($('combineCheck').checked) {
      const ht = t.language === 'html' ? t : STATE.codeTabs.find(x =&gt; x.language === 'html');
      html = ht ? ht.content : '';
      css = STATE.codeTabs.filter(x =&gt; x.language === 'css').map(x =&gt; `/* ===== ${x.name} ===== */\n${x.content}`).join('\n');
      js = STATE.codeTabs.filter(x =&gt; x.language === 'javascript').map(x =&gt; `// ===== ${x.name} =====\n${x.content}`).join('\n;\n');
    } else if (t.language === 'html') html = t.content;
    else if (t.language === 'css') { html = '&lt;h1&gt;Título&lt;/h1&gt;&lt;p&gt;Parágrafo de teste com &lt;a href=&quot;#&quot;&gt;link&lt;/a&gt;.&lt;/p&gt;&lt;button&gt;Botão&lt;/button&gt;'; css = t.content; }
    else if (t.language === 'javascript') js = t.content;
    else return `&lt;pre style=&quot;font:13px monospace;white-space:pre-wrap;padding:12px&quot;&gt;${escapeHtml(t.content)}&lt;/pre&gt;&lt;p style=&quot;font:12px sans-serif;color:#888;padding:0 12px&quot;&gt;Prévia disponível para HTML, CSS e JavaScript (ou ative 🧩 combinar abas).&lt;/p&gt;`;
    if (!/&lt;html[\s&gt;]/i.test(html)) html = `&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;UTF-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;&lt;/head&gt;&lt;body&gt;${html}&lt;/body&gt;&lt;/html&gt;`;
    html = afterTag(html, /&lt;head[^&gt;]*&gt;/i, '&lt;script&gt;' + CONSOLE_JS + '&lt;\/script&gt;');
    if (css) html = beforeTag(html, /&lt;\/head&gt;/i, `&lt;style&gt;\n${css}\n&lt;/style&gt;`);
    if (js) html = beforeTag(html, /&lt;\/body&gt;/i, '&lt;script&gt;\n' + js.replace(/&lt;\/script/gi, '&lt;\\/script') + '\n&lt;\/script&gt;');
    return html;
  }
  function refreshPreview() { if (previewOn) $('previewFrame').srcdoc = buildDoc(); }
  function openWindow() {
    const u = URL.createObjectURL(new Blob([buildDoc()], { type: 'text/html' }));
    window.open(u, '_blank');
    setTimeout(() =&gt; URL.revokeObjectURL(u), 60000);
  }
  return { togglePanel, toggleWide, sync, newTab, loadTab, renderTabs, switchTab, renameTab, closeTab, onInput, onLangChange, onKey,
           copyClean, sendToChat, download, clear, pasteToEditor, importFile, handleFileImport, copyBlock, blockToEditor, previewBlock,
           togglePreview, refreshPreview, openWindow, langFromName };
})();

/* ============================================================
   VOZ (TTS neural + ditado + modo conversa)
   ============================================================ */
const MODULE_Voice = (() =&gt; {
  let convMode = false, listening = false, rec = null, speakId = 0;
  const hasTTS = 'speechSynthesis' in window;
  const voices = () =&gt; (hasTTS ? speechSynthesis.getVoices() : []);
  function pick(name) {
    const all = voices();
    const want = name ?? S().voiceName;
    const v = all.find(x =&gt; x.name === want);
    if (v) return v;
    const pt = all.filter(x =&gt; /^pt/i.test(x.lang));
    const br = pt.filter(x =&gt; /BR/i.test(x.lang));
    return br.find(x =&gt; /francisca/i.test(x.name)) || br.find(x =&gt; /natural|neural|online/i.test(x.name)) ||
           pt.find(x =&gt; /natural|neural|online/i.test(x.name)) || br.find(x =&gt; /google/i.test(x.name)) || br[0] || pt[0] || null;
  }
  function clean(t) {
    return String(t).replace(/```[\s\S]*?(```|$)/g, ' (tem um bloco de código na tela) ')
      .replace(/`([^`]+)`/g, '$1').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/https?:\/\/\S+/g, ' link ')
      .replace(/[#*_&gt;~|•]/g, ' ').replace(/\s+/g, ' ').trim();
  }
  function chunks(t) {
    const parts = t.match(/[^.!?;:\n]+[.!?;:]*\s*/g) || [t];
    const out = []; let cur = '';
    parts.forEach(p =&gt; {
      if ((cur + p).length &gt; 220) { if (cur.trim()) out.push(cur); cur = p; } else cur += p;
    });
    if (cur.trim()) out.push(cur);
    return out;
  }
  function speak(text, onEnd) {
    if (!hasTTS) { MODULE_UI.toast('Este navegador não tem voz (TTS).', 'warn'); return; }
    speechSynthesis.cancel();
    const id = ++speakId;
    const list = chunks(clean(text));
    if (!list.length) { onEnd &amp;&amp; onEnd(); return; }
    const v = pick();
    list.forEach((c, i) =&gt; {
      const u = new SpeechSynthesisUtterance(c);
      if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'pt-BR';
      u.rate = +S().voiceRate || 1; u.pitch = +S().voicePitch || 1;
      if (i === list.length - 1) u.onend = () =&gt; { if (id === speakId &amp;&amp; onEnd) onEnd(); };
      speechSynthesis.speak(u);
    });
  }
  function stopSpeaking() { speakId++; if (hasTTS) speechSynthesis.cancel(); }
  function ui() { $('micBtn').classList.toggle('rec', listening); $('convBtn').classList.toggle('on', convMode); }
  function listen() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { MODULE_UI.toast('Reconhecimento de voz não suportado aqui — use Chrome ou Edge.', 'warn'); convMode = false; ui(); return; }
    if (listening) { rec &amp;&amp; rec.stop(); return; }
    stopSpeaking();
    rec = new SR(); rec.lang = 'pt-BR'; rec.interimResults = true; rec.continuous = false;
    const inp = $('userInput');
    const base = inp.value ? inp.value + ' ' : '';
    let finalTxt = '';
    rec.onresult = e =&gt; {
      let interim = '';
      for (let i = e.resultIndex; i &lt; e.results.length; i++) {
        if (e.results[i].isFinal) finalTxt += e.results[i][0].transcript; else interim += e.results[i][0].transcript;
      }
      inp.value = base + finalTxt + interim; MODULE_UI.autoResize(inp);
    };
    rec.onerror = e =&gt; {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { convMode = false; MODULE_UI.toast('🎤 Permita o microfone no navegador.', 'warn'); }
      else if (e.error !== 'no-speech' &amp;&amp; e.error !== 'aborted') MODULE_UI.toast('🎤 ' + e.error, 'warn');
    };
    rec.onend = () =&gt; {
      listening = false; ui();
      if (finalTxt.trim() &amp;&amp; (S().voiceAutoSend || convMode)) MODULE_Chat.send();
      else if (convMode &amp;&amp; !STATE.isLoading) setTimeout(() =&gt; { if (convMode &amp;&amp; !listening &amp;&amp; !STATE.isLoading) listen(); }, 400);
    };
    try { rec.start(); listening = true; ui(); } catch (e) { MODULE_UI.toast('🎤 ' + e.message, 'warn'); }
  }
  function toggleMic() { listen(); }
  function toggleConvMode() {
    convMode = !convMode; ui();
    if (convMode) { MODULE_UI.toast('🗣️ Modo conversa ligado: fale, a IA responde em voz e volta a ouvir.', 'success'); if (!listening) listen(); }
    else { rec &amp;&amp; rec.stop(); stopSpeaking(); MODULE_UI.toast('🗣️ Modo conversa desligado'); }
  }
  function fillVoices() {
    const sel = $('voiceSelect'); if (!sel) return;
    const all = voices();
    const pt = all.filter(v =&gt; /^pt/i.test(v.lang)), others = all.filter(v =&gt; !/^pt/i.test(v.lang));
    const cur = S().voiceName;
    sel.innerHTML = '&lt;option value=&quot;&quot;&gt;Automática (melhor voz pt-BR)&lt;/option&gt;' + [...pt, ...others].map(v =&gt;
      `&lt;option value=&quot;${escapeHtml(v.name)}&quot;${v.name === cur ? ' selected' : ''}&gt;${/natural|neural|online/i.test(v.name) ? '⭐ ' : ''}${escapeHtml(v.name)} (${v.lang})&lt;/option&gt;`).join('');
  }
  function test() {
    const prev = S().voiceName, pr = S().voiceRate, pp = S().voicePitch;
    S().voiceName = $('voiceSelect').value; S().voiceRate = +$('voiceRate').value; S().voicePitch = +$('voicePitch').value;
    speak('Olá! Esta é a voz do seu AI Code Studio. Tudo pronto para conversar.');
    S().voiceName = prev; S().voiceRate = pr; S().voicePitch = pp;
  }
  function init() { if (hasTTS) { speechSynthesis.onvoiceschanged = fillVoices; speechSynthesis.getVoices(); } }
  return { speak, stopSpeaking, listen, toggleMic, toggleConvMode, fillVoices, test, init, isConvMode: () =&gt; convMode };
})();

/* ============================================================
   CONFIGURAÇÕES
   ============================================================ */
const MODULE_Settings = (() =&gt; {
  function open() {
    const s = S();
    $('keysContainer').innerHTML = Object.entries(PROVIDERS).filter(([k]) =&gt; k !== 'ollama').map(([k, p]) =&gt; `
      &lt;div class=&quot;form-group&quot;&gt;&lt;label&gt;${p.name}&lt;/label&gt;
        &lt;div class=&quot;api-row&quot;&gt;&lt;input type=&quot;password&quot; id=&quot;key_${k}&quot; placeholder=&quot;${escapeHtml(p.hint || 'chave')}&quot; value=&quot;${escapeHtml(s.keys[k] || '')}&quot; autocomplete=&quot;off&quot;&gt;
        &lt;button class=&quot;btn&quot; type=&quot;button&quot; onclick=&quot;MODULE_UI.togglePass('key_${k}')&quot;&gt;👁️&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`).join('');
    $('serperKeyInput').value = s.serperKey || '';
    $('ollamaUrl').value = s.ollamaUrl || '';
    $('customBase').value = s.customBase || '';
    $('contextLimit').value = s.contextLimit; $('ctxVal').textContent = s.contextLimit;
    $('memoryInjectCount').value = s.memoryInjectCount;
    $('keepRecent').value = s.keepRecent;
    $('autoSummarize').checked = !!s.autoSummarize;
    $('enterSends').checked = !!s.enterSends;
    $('systemPrompt').value = s.systemPrompt;
    $('voiceRate').value = s.voiceRate; $('rateVal').textContent = s.voiceRate;
    $('voicePitch').value = s.voicePitch; $('pitchVal').textContent = s.voicePitch;
    $('voiceAutoSend').checked = !!s.voiceAutoSend;
    MODULE_Voice.fillVoices();
    $('settingsModal').classList.add('open');
  }
  function close() { $('settingsModal').classList.remove('open'); }
  function collect() {
    const s = S();
    Object.keys(PROVIDERS).forEach(k =&gt; { const el = $('key_' + k); if (el) s.keys[k] = el.value.replace(/\s+/g, ''); });
    s.serperKey = $('serperKeyInput').value.trim();
    s.ollamaUrl = $('ollamaUrl').value.trim() || 'http://localhost:11434';
    s.customBase = $('customBase').value.trim();
    s.contextLimit = +$('contextLimit').value || 32000;
    s.memoryInjectCount = Math.max(0, +$('memoryInjectCount').value || 0);
    s.keepRecent = Math.max(2, +$('keepRecent').value || 10);
    s.autoSummarize = $('autoSummarize').checked;
    s.enterSends = $('enterSends').checked;
    s.systemPrompt = $('systemPrompt').value;
    s.voiceName = $('voiceSelect').value;
    s.voiceRate = +$('voiceRate').value || 1; s.voicePitch = +$('voicePitch').value || 1;
    s.voiceAutoSend = $('voiceAutoSend').checked;
    MODULE_Storage.save();
    MODULE_UI.updatePlaceholder();
    MODULE_Context.updateBar();
  }
  function save() { collect(); close(); MODULE_UI.toast('✅ Configurações salvas!', 'success'); }
  async function test() {
    if ($('settingsModal').classList.contains('open')) collect();
    const { provider, model } = MODULE_Provider.current();
    MODULE_UI.toast(`🧪 Testando ${PROVIDERS[provider].name} · ${model}...`);
    try {
      const r = await MODULE_AI.call(provider, model, '', [{ role: 'user', content: 'Responda apenas com a palavra OK.' }], { temperature: 0, maxTokens: 1024 });
      MODULE_UI.toast(`✅ ${PROVIDERS[provider].name} funcionando! Resposta: &quot;${r.trim().slice(0, 40)}&quot;`, 'success');
    } catch (e) { MODULE_UI.toast('❌ ' + e.message, 'error'); }
  }
  function quick(k, v) { S()[k] = v; MODULE_Storage.saveSoon(); }
  return { open, close, save, test, quick };
})();

/* ============================================================
   UI
   ============================================================ */
const MODULE_UI = (() =&gt; {
  let tt = null;
  function toast(msg, type = '') {
    const el = $('toast');
    el.textContent = msg; el.className = `toast show ${type}`;
    clearTimeout(tt);
    tt = setTimeout(() =&gt; { el.className = 'toast'; }, type === 'error' ? 7000 : type === 'warn' ? 5000 : 3000);
  }
  function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 200) + 'px'; }
  function handleKey(e) {
    if (e.key !== 'Enter') return;
    if (e.ctrlKey || e.metaKey || (S().enterSends &amp;&amp; !e.shiftKey &amp;&amp; !isMobile())) { e.preventDefault(); MODULE_Chat.send(); }
  }
  function togglePass(id) { const el = $(id); el.type = el.type === 'password' ? 'text' : 'password'; }
  function toggleSidebar() { $('sidebar').classList.toggle('open'); if ($('sidebar').classList.contains('open')) closeOthersMobile('sidebar'); }
  function toggleMenu() { $('menu').classList.toggle('open'); }
  function closeOthersMobile(keep) {
    if (!isMobile()) return;
    ['sidebar', 'codePanel', 'brainPanel'].forEach(id =&gt; { if (id !== keep) $(id).classList.remove('open'); });
    $('codeBtn').classList.toggle('on', keep === 'codePanel');
    $('brainBtn').classList.toggle('on', keep === 'brainPanel');
  }
  function setTypingStatus(t) { const el = $('typingStatus'); if (el) el.textContent = t; }
  function updatePlaceholder() { $('userInput').placeholder = S().enterSends ? 'Mensagem... (Enter envia, Shift+Enter quebra linha)' : 'Mensagem... (Ctrl+Enter envia)'; }
  return { toast, autoResize, handleKey, togglePass, toggleSidebar, toggleMenu, closeOthersMobile, setTypingStatus, updatePlaceholder };
})();

function refreshAll() {
  MODULE_Provider.init();
  $('tempSlider').value = S().temperature; $('tempVal').textContent = S().temperature;
  $('maxTokens').value = S().maxTokens;
  $('autoReadCheck').checked = !!S().autoRead;
  MODULE_UI.updatePlaceholder();
  if (!STATE.codeTabs.length) STATE.codeTabs.push({ id: uid('tab'), name: 'index.html', content: '', language: 'html' });
  STATE.activeCodeTab = Math.max(0, Math.min(STATE.activeCodeTab || 0, STATE.codeTabs.length - 1));
  MODULE_Code.loadTab();
  const ids = Object.keys(STATE.conversations);
  if (!ids.length) MODULE_Chat.createNew();
  else MODULE_Chat.load(STATE.conversations[STATE.activeConvId] ? STATE.activeConvId
    : Object.values(STATE.conversations).sort((a, b) =&gt; b.updatedAt - a.updatedAt)[0].id);
  MODULE_Brain.render();
}
function INIT() {
  MODULE_Storage.load();
  if (!isMobile()) $('sidebar').classList.add('open');
  refreshAll();
  MODULE_Voice.init();
  window.addEventListener('beforeunload', () =&gt; { MODULE_Code.sync(); MODULE_Storage.save(); });
  document.addEventListener('visibilitychange', () =&gt; { if (document.hidden) { MODULE_Code.sync(); MODULE_Storage.save(); } });
  document.addEventListener('click', e =&gt; { if (!e.target.closest('#menu') &amp;&amp; !e.target.closest('#menuBtn')) $('menu').classList.remove('open'); });
  document.addEventListener('keydown', e =&gt; { if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.open').forEach(m =&gt; m.classList.remove('open')); });
  document.querySelectorAll('.modal-overlay').forEach(o =&gt; o.addEventListener('click', e =&gt; { if (e.target === o) o.classList.remove('open'); }));
  if (!Object.values(S().keys).some(Boolean)) MODULE_UI.toast('👋 Abra ⚙️ e coloque a chave da IA que você vai usar.', 'warn');
}
INIT();

<script>
function trocarProjeto(index) {
  document.querySelectorAll('.project-container').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  
  document.getElementById('projeto' + index).classList.add('active');
  document.querySelectorAll('.nav-btn')[index].classList.add('active');
  
  localStorage.setItem('ultimo-projeto', index);
}

window.onload = function() {
  const ultimo = localStorage.getItem('ultimo-projeto');
  if (ultimo !== null) trocarProjeto(parseInt(ultimo));
};

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
